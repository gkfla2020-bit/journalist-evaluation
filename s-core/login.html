<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - S-CORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            min-height: 100vh; 
            display: flex;
            font-family: 'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
            background: #f5f7fa;
        }
        .brand-section {
            flex: 1;
            background: linear-gradient(135deg, #1a365d 0%, #2c5282 50%, #2b6cb0 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }
        .brand-section::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
            animation: pulse 15s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.3; }
        }
        .brand-content { position: relative; z-index: 1; text-align: center; color: white; }
        .brand-logo {
            width: 100px;
            height: 100px;
            background: rgba(255,255,255,0.15);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            backdrop-filter: blur(10px);
        }
        .brand-logo i { font-size: 3rem; }
        .brand-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: 2px; }
        .brand-subtitle { font-size: 1rem; opacity: 0.85; margin-bottom: 2rem; }
        .brand-features {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .brand-feature {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.25rem;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            font-size: 0.9rem;
        }
        .brand-feature i {
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.15);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-section {
            width: 480px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3rem;
            background: white;
        }
        .login-header { margin-bottom: 2rem; }
        .login-header h2 { font-size: 1.75rem; font-weight: 700; color: #1a202c; margin-bottom: 0.5rem; }
        .login-header p { color: #718096; font-size: 0.95rem; }
        .form-label { font-weight: 600; color: #4a5568; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .form-control {
            padding: 0.875rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .form-control:focus { border-color: #2b6cb0; box-shadow: 0 0 0 3px rgba(43, 108, 176, 0.15); }
        .input-group-text {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-right: none;
            border-radius: 10px 0 0 10px;
            color: #718096;
        }
        .input-group .form-control { border-left: none; border-radius: 0 10px 10px 0; }
        .input-group:focus-within .input-group-text { border-color: #2b6cb0; }
        .btn-login {
            background: linear-gradient(135deg, #2b6cb0 0%, #2c5282 100%);
            border: none;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(43, 108, 176, 0.35); }
        .alert { border-radius: 10px; border: none; padding: 1rem; }
        .alert-danger { background: #fff5f5; color: #c53030; }
        .login-footer { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #e2e8f0; text-align: center; }
        .login-footer p { color: #a0aec0; font-size: 0.85rem; }
        .test-accounts {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #f7fafc;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .test-accounts-title { font-size: 0.8rem; color: #718096; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
        .test-account-item { display: flex; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
        .test-account-item:last-child { border-bottom: none; }
        .test-account-item .badge { width: 60px; font-size: 0.7rem; padding: 4px 8px; }
        .test-account-item .info { flex: 1; margin-left: 0.75rem; color: #4a5568; }
        .test-account-item .pw { color: #a0aec0; font-family: monospace; }
        @media (max-width: 992px) {
            body { flex-direction: column; }
            .brand-section { padding: 2rem; min-height: auto; }
            .brand-features { display: none; }
            .login-section { width: 100%; }
        }
    </style>
</head>
<body>

<div class="brand-section">
    <div class="brand-content">
        <div class="brand-logo">
            <i class="bi bi-trophy-fill"></i>
        </div>
        <h1 class="brand-title">S-CORE</h1>
        <p class="brand-subtitle">기자 지면 기여도 점수 산출 시스템</p>
        
        <div class="brand-features">
            <div class="brand-feature">
                <i class="bi bi-calculator"></i>
                <span>면·분량 기반 자동 점수 산출</span>
            </div>
            <div class="brand-feature">
                <i class="bi bi-check2-square"></i>
                <span>품질 가점 체크박스 입력</span>
            </div>
            <div class="brand-feature">
                <i class="bi bi-shield-check"></i>
                <span>Max-Auto, Min-Manual 철학</span>
            </div>
        </div>
    </div>
</div>

<div class="login-section">
    <div class="login-header">
        <h2>로그인</h2>
        <p>사번과 비밀번호를 입력해주세요</p>
    </div>
    
    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>
    
    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">사번</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="userId" placeholder="사번을 입력하세요" required>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label">비밀번호</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="비밀번호를 입력하세요" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-login w-100">로그인</button>
    </form>
    
    <div class="test-accounts">
        <div class="test-accounts-title">
            <i class="bi bi-info-circle"></i>
            테스트 계정 안내
        </div>
        <div class="test-account-item">
            <span class="badge bg-danger">Admin</span>
            <span class="info">admin (관리자)</span>
            <span class="pw">1234</span>
        </div>
        <div class="test-account-item">
            <span class="badge bg-primary">Manager</span>
            <span class="info">80486 (서일범 부장)</span>
            <span class="pw">1234</span>
        </div>
        <div class="test-account-item">
            <span class="badge bg-secondary">Reporter</span>
            <span class="info">211010 (주재현 기자)</span>
            <span class="pw">1234</span>
        </div>
    </div>
    
    <div class="login-footer">
        <p>© 2026 서울경제신문. S-CORE v1.0</p>
    </div>
</div>

<script>
// 테스트용 사용자 데이터
const USERS = [
    { id: 'admin', name: '관리자', role: 'admin', department: '전체', password: '1234' },
    { id: '80486', name: '서일범', role: 'manager', department: '경제부', password: '1234' },
    { id: '10579', name: '이철균', role: 'manager', department: '편집국', password: '1234' },
    { id: '211010', name: '주재현', role: 'reporter', department: '경제부', password: '1234' },
    { id: '200101', name: '김기자', role: 'reporter', department: '경제부', password: '1234' },
    { id: '200102', name: '이기자', role: 'reporter', department: '산업부', password: '1234' }
];

document.addEventListener('DOMContentLoaded', () => {
    const session = localStorage.getItem('score_session');
    if (session) {
        const user = JSON.parse(session);
        redirectByRole(user);
    }
});

document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const userId = document.getElementById('userId').value.trim();
    const password = document.getElementById('password').value;
    const alertBox = document.getElementById('alertBox');
    
    const user = USERS.find(u => u.id === userId);
    if (!user || user.password !== password) {
        alertBox.textContent = '사번 또는 비밀번호가 올바르지 않습니다.';
        alertBox.classList.remove('d-none');
        return;
    }
    
    alertBox.classList.add('d-none');
    
    const session = {
        userId: user.id,
        name: user.name,
        role: user.role,
        department: user.department,
        loginTime: new Date().toISOString()
    };
    localStorage.setItem('score_session', JSON.stringify(session));
    redirectByRole(session);
});

function redirectByRole(user) {
    if (user.role === 'admin') {
        location.href = 'admin.html';
    } else if (user.role === 'manager') {
        location.href = 'manager.html';
    } else {
        location.href = 'reporter.html';
    }
}
</script>
</body>
</html>
