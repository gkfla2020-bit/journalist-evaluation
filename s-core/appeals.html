<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소명 관리 - S-CORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; font-family: 'Pretendard', -apple-system, sans-serif; }
        .container-main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .header { background: linear-gradient(135deg, #1a365d 0%, #2c5282 50%, #2b6cb0 100%); color: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
        .card-header { background: #2c5282; color: white; font-weight: 600; border-radius: 12px 12px 0 0 !important; padding: 1rem 1.5rem; }
        .nav-menu { background: white; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .nav-menu a { color: #2c5282; text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; margin-right: 0.5rem; transition: all 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { background: #2c5282; color: white; }
        .appeal-card { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 4px solid #f59e0b; }
        .appeal-card.approved { border-left-color: #10b981; }
        .appeal-card.rejected { border-left-color: #ef4444; }
        .status-badge { padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .status-submitted { background: #fef3c7; color: #92400e; }
        .status-approved { background: #d1fae5; color: #065f46; }
        .status-rejected { background: #fee2e2; color: #991b1b; }
        .quality-badge { padding: 0.25rem 0.5rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; }
        .quality-top { background: #fef3c7; color: #92400e; }
        .quality-exclusive { background: #fee2e2; color: #991b1b; }
        .quality-feature { background: #ede9fe; color: #5b21b6; }
        .quality-sgrade { background: #d1fae5; color: #065f46; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body>
<div class="container-main">

<!-- 토스트 -->
<div class="toast-container">
    <div id="toast" class="toast align-items-center text-bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- 헤더 -->
<div class="header">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h1 style="font-size:1.8rem; margin-bottom:0.25rem;"><i class="bi bi-chat-left-text me-2"></i>소명 관리</h1>
            <div style="opacity:0.9;">S-CORE 점수 산출 시스템</div>
        </div>
        <div class="text-end">
            <span class="badge bg-light text-dark fs-6" id="deptBadge">-</span>
            <div class="mt-2">
                <small id="userInfo" class="me-2"></small>
                <button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 로그아웃</button>
            </div>
        </div>
    </div>
</div>

<!-- 네비게이션 -->
<div class="nav-menu">
    <a href="manager.html"><i class="bi bi-clipboard-check me-1"></i>기사 평가</a>
    <a href="appeals.html" class="active"><i class="bi bi-chat-left-text me-1"></i>소명 관리</a>
</div>

<!-- 필터 -->
<div class="card">
    <div class="card-body">
        <div class="row align-items-center">
            <div class="col-md-4">
                <select class="form-select" id="statusFilter" onchange="renderAppeals()">
                    <option value="">전체 상태</option>
                    <option value="SUBMITTED">대기중</option>
                    <option value="APPROVED">승인</option>
                    <option value="REJECTED">반려</option>
                </select>
            </div>
            <div class="col-md-4">
                <span class="badge bg-warning text-dark" id="pendingCount">0</span> 건 대기중
            </div>
        </div>
    </div>
</div>

<!-- 소명 목록 -->
<div id="appealsList"></div>

<!-- 빈 상태 -->
<div id="emptyState" class="text-center py-5 text-muted" style="display:none;">
    <i class="bi bi-inbox" style="font-size:3rem;"></i>
    <p class="mt-3">소명 요청이 없습니다</p>
</div>

</div>

<!-- 처리 모달 -->
<div class="modal fade" id="reviewModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-check-circle me-2"></i>소명 처리</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="reviewAppealInfo" class="mb-3 p-3 bg-light rounded"></div>
                <div class="mb-3">
                    <label class="form-label fw-bold">처리 코멘트</label>
                    <textarea class="form-control" id="reviewComment" rows="3" placeholder="처리 사유를 입력해주세요..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-danger" onclick="processAppeal('REJECTED')">
                    <i class="bi bi-x-circle me-1"></i>반려
                </button>
                <button type="button" class="btn btn-success" onclick="processAppeal('APPROVED')">
                    <i class="bi bi-check-circle me-1"></i>승인
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="score.js"></script>
<script src="data.js"></script>
<script>
// 로그인 체크
const session = JSON.parse(localStorage.getItem('score_session') || 'null');
if (!session || session.role !== 'manager') {
    location.href = 'login.html';
}

document.getElementById('userInfo').textContent = session.name + ' 부장';
document.getElementById('deptBadge').textContent = session.department;

let currentAppealId = null;

function logout() {
    localStorage.removeItem('score_session');
    location.href = 'login.html';
}

// 품질 유형 텍스트
function getQualityText(type) {
    const map = {
        'TOP_ARTICLE': '면톱 (+2점)',
        'EXCLUSIVE': '단독/특종 (+5점)',
        'FEATURE': '기획 (+5점)',
        'S_GRADE': 'S등급 (+3점)'
    };
    return map[type] || type;
}

// 품질 유형 배지 클래스
function getQualityClass(type) {
    const map = {
        'TOP_ARTICLE': 'quality-top',
        'EXCLUSIVE': 'quality-exclusive',
        'FEATURE': 'quality-feature',
        'S_GRADE': 'quality-sgrade'
    };
    return map[type] || '';
}

// 소명 목록 렌더링
function renderAppeals() {
    const statusFilter = document.getElementById('statusFilter').value;
    
    // 부서 기자들의 소명만 조회
    const allAppeals = DataStore.getAppeals();
    const deptArticles = DataStore.getArticles({ department: session.department });
    const deptReporterIds = [...new Set(deptArticles.map(a => a.reporterId))];
    
    let appeals = allAppeals.filter(a => deptReporterIds.includes(a.reporterId));
    
    if (statusFilter) {
        appeals = appeals.filter(a => a.status === statusFilter);
    }
    
    const pendingCount = appeals.filter(a => a.status === 'SUBMITTED').length;
    document.getElementById('pendingCount').textContent = pendingCount;
    
    const container = document.getElementById('appealsList');
    const emptyState = document.getElementById('emptyState');
    
    if (appeals.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
    }
    
    emptyState.style.display = 'none';
    
    container.innerHTML = appeals.map(appeal => {
        const statusClass = appeal.status === 'APPROVED' ? 'approved' : (appeal.status === 'REJECTED' ? 'rejected' : '');
        const statusBadgeClass = appeal.status === 'APPROVED' ? 'status-approved' : (appeal.status === 'REJECTED' ? 'status-rejected' : 'status-submitted');
        const statusText = appeal.status === 'APPROVED' ? '승인' : (appeal.status === 'REJECTED' ? '반려' : '대기중');
        
        return `
            <div class="appeal-card ${statusClass}">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <div>
                        <span class="status-badge ${statusBadgeClass}">${statusText}</span>
                        <span class="quality-badge ${getQualityClass(appeal.qualityType)} ms-2">${getQualityText(appeal.qualityType)}</span>
                    </div>
                    <small class="text-muted">${new Date(appeal.submittedAt).toLocaleString('ko-KR')}</small>
                </div>
                
                <h6 class="fw-bold mb-2">${appeal.articleTitle}</h6>
                <p class="text-muted mb-3">요청자: ${appeal.reporterName}</p>
                
                <div class="bg-light p-3 rounded mb-3">
                    <small class="text-muted">소명 사유</small>
                    <p class="mb-0 mt-1">${appeal.reason}</p>
                </div>
                
                ${appeal.status !== 'SUBMITTED' ? `
                    <div class="border-top pt-3 mt-3">
                        <small class="text-muted">처리 결과</small>
                        <p class="mb-0 mt-1">${appeal.managerComment || '-'}</p>
                        <small class="text-muted">처리일: ${appeal.reviewedAt ? new Date(appeal.reviewedAt).toLocaleString('ko-KR') : '-'}</small>
                    </div>
                ` : `
                    <div class="text-end">
                        <button class="btn btn-primary btn-sm" onclick="openReviewModal('${appeal.id}')">
                            <i class="bi bi-check-circle me-1"></i>처리하기
                        </button>
                    </div>
                `}
            </div>
        `;
    }).join('');
}

// 처리 모달 열기
function openReviewModal(appealId) {
    currentAppealId = appealId;
    const appeals = DataStore.getAppeals();
    const appeal = appeals.find(a => a.id === appealId);
    
    if (appeal) {
        document.getElementById('reviewAppealInfo').innerHTML = `
            <strong>${appeal.articleTitle}</strong><br>
            <small class="text-muted">요청자: ${appeal.reporterName}</small><br>
            <span class="quality-badge ${getQualityClass(appeal.qualityType)} mt-2">${getQualityText(appeal.qualityType)}</span>
            <p class="mt-2 mb-0">${appeal.reason}</p>
        `;
    }
    
    document.getElementById('reviewComment').value = '';
    new bootstrap.Modal(document.getElementById('reviewModal')).show();
}

// 소명 처리
function processAppeal(status) {
    const comment = document.getElementById('reviewComment').value.trim();
    
    if (!comment) {
        showToast('처리 코멘트를 입력해주세요', 'warning');
        return;
    }
    
    DataStore.reviewAppeal(currentAppealId, session.userId, status, comment);
    
    bootstrap.Modal.getInstance(document.getElementById('reviewModal')).hide();
    renderAppeals();
    showToast(status === 'APPROVED' ? '승인되었습니다' : '반려되었습니다');
}

// 토스트
function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.className = `toast align-items-center text-bg-${type} border-0`;
    document.getElementById('toastMsg').textContent = msg;
    new bootstrap.Toast(t).show();
}

// 초기 로드
renderAppeals();
</script>
</body>
</html>
