<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기자 목록 - S-CORE</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="data.json" as="fetch" crossorigin>
    <link rel="preload" href="users.json" as="fetch" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; font-family: 'Pretendard', -apple-system, sans-serif; }
        .container-main { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
        .header { background: linear-gradient(135deg, #1a365d 0%, #2c5282 50%, #2b6cb0 100%); color: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
        .card-header { background: #2c5282; color: white; font-weight: 600; border-radius: 12px 12px 0 0 !important; padding: 1rem 1.5rem; }
        .stat-card { background: white; border-radius: 12px; padding: 1.5rem; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .stat-card .value { font-size: 2.5rem; font-weight: 700; color: #2c5282; }
        .stat-card .label { font-size: 0.9rem; color: #718096; margin-top: 0.5rem; }
        .reporter-row { cursor: pointer; transition: background 0.2s; }
        .reporter-row:hover { background: #ebf4ff !important; }
        .search-box { max-width: 300px; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .nav-menu { background: white; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .nav-menu a { color: #2c5282; text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; margin-right: 0.5rem; transition: all 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { background: #2c5282; color: white; }
        .dept-badge { background: #ebf4ff; color: #2c5282; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.85rem; }
        .btn-outline-light:hover { background: rgba(255,255,255,0.15); }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spin { display: inline-block; animation: spin 1s linear infinite; }
    </style>
</head>
<body>
<div class="container-main">

<!-- 토스트 -->
<div class="toast-container">
    <div id="toast" class="toast align-items-center text-bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toastMsg"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- 헤더 -->
<div class="header">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h1 style="font-size:1.8rem; margin-bottom:0.25rem;"><i class="bi bi-bar-chart-fill me-2"></i>S-CORE</h1>
            <div style="opacity:0.9;">기자 지면 기여도 평가 시스템</div>
        </div>
        <div class="text-end">
            <small id="userInfo" class="me-2"></small>
            <button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 로그아웃</button>
        </div>
    </div>
</div>

<!-- 네비게이션 -->
<div class="nav-menu" id="navMenu">
    <a href="home.html" id="nav-home" style="display:none"><i class="bi bi-house-door me-1"></i>대시보드</a>
    <a href="score-dashboard.html"><i class="bi bi-speedometer2 me-1"></i>부서 대시보드</a>
    <a href="list.html" class="active"><i class="bi bi-people me-1"></i>기자 목록</a>
    <a href="score-eval.html"><i class="bi bi-clipboard-check me-1"></i>기사 평가</a>
    <a href="score-penalties.html"><i class="bi bi-plus-slash-minus me-1"></i>가감점 관리</a>
    <a href="score-appeals.html"><i class="bi bi-chat-left-text me-1"></i>소명 관리</a>
    <a href="score-config.html" id="nav-config" style="display:none"><i class="bi bi-sliders me-1"></i>가중치 설정</a>
    <a href="admin.html" id="nav-admin" style="display:none"><i class="bi bi-person-gear me-1"></i>사원 관리</a>
    <a href="dept-manage.html" id="nav-dept" style="display:none"><i class="bi bi-building me-1"></i>부서 관리</a>
</div>

<!-- 부서 필터 (admin만 표시) -->
<div class="card mb-4" id="deptFilterCard" style="display:none;">
    <div class="card-body">
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <label class="fw-bold text-nowrap me-2">부서 선택</label>
            <select class="form-select" id="deptSelect" style="width:200px;" onchange="filterByDept()">
                <option value="">전체 부서</option>
            </select>
            <span class="dept-badge" id="currentDept">전체</span>
        </div>
    </div>
</div>

<!-- 기간 선택 & 동기화 -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row align-items-center">
            <div class="col-md-8">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <label class="fw-bold text-nowrap me-2">조회 기간</label>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-outline-primary" onclick="setPeriod('yearly', this)">연간</button>
                        <button type="button" class="btn btn-outline-primary active" onclick="setPeriod('monthly', this)">월별</button>
                        <button type="button" class="btn btn-outline-primary" onclick="setPeriod('weekly', this)">주별</button>
                        <button type="button" class="btn btn-outline-primary" onclick="setPeriod('daily', this)">일별</button>
                    </div>
                    <div id="periodNav" class="d-flex align-items-center gap-2 ms-3" style="display:none;"></div>
                </div>
            </div>
            <div class="col-md-4 text-end" id="syncBtnArea">
                <button class="btn btn-outline-success" id="syncBtn" onclick="syncData()">
                    <i class="bi bi-cloud-download me-1"></i>데이터 동기화
                </button>
            </div>
        </div>
        <div class="mt-2">
            <small class="text-muted">
                <i class="bi bi-info-circle me-1"></i>
                데이터 기간: <span id="dataRange">-</span> | 
                마지막 동기화: <span id="lastSyncTime">-</span>
            </small>
        </div>
    </div>
</div>

<!-- 요약 통계 -->
<div class="row g-3 mb-4">
    <div class="col-md-3">
        <div class="stat-card">
            <div class="value" id="stat-articles">-</div>
            <div class="label">총 기사 수</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card">
            <div class="value" id="stat-reporters">-</div>
            <div class="label">기자 수</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card">
            <div class="value" id="stat-evaluated">0</div>
            <div class="label">평가 완료</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card">
            <div class="value" id="stat-period">-</div>
            <div class="label">데이터 기간</div>
        </div>
    </div>
</div>

<!-- 기자 목록 -->
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-people-fill me-2"></i>기자 목록 <span id="deptTitle"></span></span>
        <div class="d-flex gap-2 align-items-center">
            <input type="text" class="form-control form-control-sm search-box" id="searchInput" placeholder="기자명 검색...">
            <span class="badge bg-light text-dark" id="reporterCount">0명</span>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width:4%">#</th>
                        <th style="width:7%">기자명</th>
                        <th style="width:7%" id="deptCol" class="hide-mobile">부서</th>
                        <th style="width:5%">기사수</th>
                        <th style="width:5%" class="hide-mobile">조회수</th>
                        <th style="width:5%" class="hide-mobile">단독</th>
                        <th style="width:5%" class="hide-mobile">면톱</th>
                        <th style="width:5%" class="hide-mobile">기획</th>
                        <th style="width:5%" class="hide-mobile">기자상</th>
                        <th style="width:5%" class="hide-mobile">정보보고</th>
                        <th style="width:5%" class="hide-mobile">기명온라인</th>
                        <th style="width:7%" id="scoreHeader">절대점수</th>
                        <th style="width:7%">상대점수</th>
                        <th style="width:9%">가중치</th>
                        <th style="width:8%">최종점수</th>
                        <th style="width:5%">상세</th>
                    </tr>
                </thead>
                <tbody id="reporterList">
                    <tr><td colspan="16" class="text-center py-4 text-muted">데이터 로딩중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 하단 버튼 -->
<div class="d-flex justify-content-between mt-4">
    <div></div>
    <button class="btn btn-success" onclick="exportExcel()">
        <i class="bi bi-file-earmark-excel me-1"></i>엑셀 내보내기
    </button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="common.js"></script>
<script src="config.js"></script>
<script src="score.js"></script>
<script src="score-data.js"></script>
<script>
// 로그인 체크
const session = JSON.parse(localStorage.getItem('kpi_session') || 'null');
if (!session) {
    location.href = 'login.html';
}

// 세션 만료 체크 (24시간)
if (session && session.loginTime) {
    const loginTime = new Date(session.loginTime);
    const now = new Date();
    const hoursDiff = (now - loginTime) / (1000 * 60 * 60);
    if (hoursDiff > 24) {
        localStorage.removeItem('kpi_session');
        alert('세션이 만료되었습니다. 다시 로그인해주세요.');
        location.href = 'login.html';
    }
}

// 권한 체크: admin 또는 manager만 접근 가능
if (session.role !== 'admin' && session.role !== 'manager') {
    alert('접근 권한이 없습니다.');
    location.href = 'login.html';
}

document.getElementById('userInfo').textContent = session.role === 'admin' ? '관리자님' : `${session.name}님`;

// Admin만 대시보드, 가중치설정, 사원관리, 부서관리 표시
if (session.role === 'admin') {
    document.getElementById('nav-home').style.display = '';
    document.getElementById('nav-config').style.display = '';
    document.getElementById('nav-admin').style.display = '';
    document.getElementById('nav-dept').style.display = '';
}

function logout() {
    localStorage.removeItem('kpi_session');
    location.href = 'login.html';
}

let allData = null;
let usersData = [];
let evaluationsData = {};
let currentPeriod = 'monthly';
let selectedDate = new Date();
let selectedDept = '';

const EVAL_API_URL = APP_CONFIG.EVAL_API_URL;

// URL에서 부서 파라미터 확인
const urlParams = new URLSearchParams(window.location.search);
const deptParam = urlParams.get('dept');

// 초기 로드 - 병렬 로딩으로 속도 개선
document.addEventListener('DOMContentLoaded', async () => {
    // 병렬로 데이터 로드 (Promise.allSettled로 하나 실패해도 계속 진행)
    const [usersResult, evalResult] = await Promise.allSettled([
        fetch('users.json?t=' + Date.now()).then(r => r.json()),
        fetch(EVAL_API_URL + '?t=' + Date.now()).then(r => r.ok ? r.json() : {})
    ]);
    
    if (usersResult.status === 'fulfilled') usersData = usersResult.value;
    if (evalResult.status === 'fulfilled') evaluationsData = evalResult.value;
    
    // admin이면 부서 필터 표시
    if (session.role === 'admin') {
        document.getElementById('deptFilterCard').style.display = 'block';
        populateDeptSelect();
    } else if (session.role === 'manager') {
        // manager는 자기 부서만
        selectedDept = session.department;
        document.getElementById('currentDept').textContent = selectedDept;
        document.getElementById('deptTitle').textContent = `- ${selectedDept}`;
        document.getElementById('syncBtnArea').style.display = 'none'; // 동기화 버튼 숨김
    }
    
    // URL 파라미터로 부서 지정된 경우
    if (deptParam) {
        selectedDept = deptParam;
        document.getElementById('deptSelect').value = deptParam;
        document.getElementById('currentDept').textContent = deptParam;
        document.getElementById('deptTitle').textContent = `- ${deptParam}`;
    }
    
    loadData();
});

// 부서 선택 옵션 채우기
async function populateDeptSelect() {
    // 서버에서 부서 설정 로드
    const deptConfig = await ScoreDataStore.loadDeptConfigFromServer();
    
    const depts = [...new Set(usersData.map(u => u.department).filter(d => d && d !== '전체'))];
    depts.sort();
    const select = document.getElementById('deptSelect');
    depts.forEach(d => {
        // visible=false인 부서는 제외
        if (deptConfig[d]?.visible === false) return;
        
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        select.appendChild(opt);
    });
}

// 부서 필터
function filterByDept() {
    selectedDept = document.getElementById('deptSelect').value;
    document.getElementById('currentDept').textContent = selectedDept || '전체';
    document.getElementById('deptTitle').textContent = selectedDept ? `- ${selectedDept}` : '';
    updateView(null);
}

// 데이터 로드
async function loadData() {
    SCore.showLoading('기자 목록을 불러오는 중...');
    SCore.showInlineLoading('reporterList', 16);
    
    try {
        const res = await fetch('data.json?t=' + Date.now());
        if (!res.ok) throw new Error(res.status.toString());
        allData = await res.json();
        
        document.getElementById('dataRange').textContent = `${allData.period_start} ~ ${allData.period_end}`;
        document.getElementById('lastSyncTime').textContent = allData.last_sync;
        
        selectedDate = new Date();
        updateView();
        
        const searchInput = document.getElementById('searchInput');
        searchInput.removeEventListener('input', handleSearch);
        searchInput.addEventListener('input', handleSearch);
    } catch (err) {
        console.error(err);
        SCore.showError('reporterList', {
            title: '기자 목록을 불러올 수 없습니다',
            message: SCore.getErrorMessage(err),
            retryCallback: 'loadData()',
            colspan: 16
        });
    } finally {
        SCore.hideLoading();
    }
}

// 기간 설정
function setPeriod(period, btn) {
    currentPeriod = period;
    document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updatePeriodNav();
    updateView(null);
}

// 기간 네비게이션 UI
function updatePeriodNav() {
    const nav = document.getElementById('periodNav');
    nav.style.display = 'flex';
    
    if (currentPeriod === 'daily') {
        nav.innerHTML = `
            <button class="btn btn-sm btn-outline-secondary" onclick="moveDate(-1)"><i class="bi bi-chevron-left"></i></button>
            <input type="date" class="form-control form-control-sm" value="${formatDate(selectedDate)}" style="width:150px;" onchange="setDateFromInput(this.value)">
            <button class="btn btn-sm btn-outline-secondary" onclick="moveDate(1)"><i class="bi bi-chevron-right"></i></button>
            <span class="ms-2 fw-bold">${formatDateKR(selectedDate)}</span>
        `;
    } else if (currentPeriod === 'weekly') {
        const ws = getWeekStart(selectedDate);
        const we = new Date(ws); we.setDate(ws.getDate() + 6);
        nav.innerHTML = `
            <button class="btn btn-sm btn-outline-secondary" onclick="moveDate(-7)"><i class="bi bi-chevron-left"></i> 이전주</button>
            <span class="mx-3 fw-bold">${formatDate(ws)} ~ ${formatDate(we)}</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="moveDate(7)">다음주 <i class="bi bi-chevron-right"></i></button>
        `;
    } else if (currentPeriod === 'monthly') {
        nav.innerHTML = `
            <button class="btn btn-sm btn-outline-secondary" onclick="moveMonth(-1)"><i class="bi bi-chevron-left"></i> 이전달</button>
            <span class="mx-3 fw-bold">${selectedDate.getFullYear()}년 ${selectedDate.getMonth()+1}월</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="moveMonth(1)">다음달 <i class="bi bi-chevron-right"></i></button>
        `;
    } else if (currentPeriod === 'yearly') {
        nav.innerHTML = `
            <button class="btn btn-sm btn-outline-secondary" onclick="moveYear(-1)"><i class="bi bi-chevron-left"></i> 이전연도</button>
            <span class="mx-3 fw-bold">${selectedDate.getFullYear()}년</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="moveYear(1)">다음연도 <i class="bi bi-chevron-right"></i></button>
        `;
    }
}

// 날짜 입력 유효성 검사
function setDateFromInput(value) {
    if (!value) return;
    const newDate = new Date(value);
    if (isNaN(newDate.getTime())) {
        alert('유효하지 않은 날짜입니다.');
        return;
    }
    selectedDate = newDate;
    updatePeriodNav();
    updateView(null);
}

// 뷰 업데이트
function updateView(searchKeyword = null) {
    if (searchKeyword === null) {
        searchKeyword = document.getElementById('searchInput').value;
    }
    const filtered = getFilteredData(searchKeyword);
    
    const totalArticles = filtered.reduce((s, r) => s + r.article_count, 0);
    document.getElementById('stat-articles').textContent = totalArticles;
    document.getElementById('stat-reporters').textContent = filtered.length;
    document.getElementById('reporterCount').textContent = filtered.length + '명';
    
    // 평가 완료 수 계산
    const evaluatedCount = Object.keys(evaluationsData).filter(nsid => 
        evaluationsData[nsid] && evaluationsData[nsid].impact_grade
    ).length;
    document.getElementById('stat-evaluated').textContent = evaluatedCount;
    
    let periodText = `${selectedDate.getFullYear()}년`;
    let scoreHeaderText = `절대점수 (${selectedDate.getFullYear()}년)`;
    if (currentPeriod === 'daily') {
        periodText = formatDate(selectedDate).slice(5);
        scoreHeaderText = `절대점수 (${formatDate(selectedDate).slice(5)})`;
    }
    else if (currentPeriod === 'weekly') {
        const ws = getWeekStart(selectedDate);
        const we = new Date(ws); we.setDate(ws.getDate() + 6);
        periodText = `${formatDate(ws).slice(5)} ~ ${formatDate(we).slice(5)}`;
        scoreHeaderText = `절대점수 (${formatDate(ws).slice(5)}~)`;
    } else if (currentPeriod === 'monthly') {
        periodText = `${selectedDate.getMonth()+1}월`;
        scoreHeaderText = `절대점수 (${selectedDate.getMonth()+1}월)`;
    } else if (currentPeriod === 'yearly') {
        periodText = `${selectedDate.getFullYear()}년`;
        scoreHeaderText = `절대점수 (${selectedDate.getFullYear()}년)`;
    }
    document.getElementById('stat-period').textContent = periodText;
    document.getElementById('scoreHeader').textContent = scoreHeaderText;
    
    renderTable(filtered);
}

// 필터링된 데이터
function getFilteredData(searchKeyword = '') {
    if (!allData) return [];
    
    let articles = allData.reporters.flatMap(r => r.articles || []);
    
    // 기간 필터
    if (currentPeriod === 'daily') {
        const ds = formatDate(selectedDate);
        articles = articles.filter(a => a.pub_date === ds);
    } else if (currentPeriod === 'weekly') {
        const ws = getWeekStart(selectedDate);
        const we = new Date(ws); we.setDate(ws.getDate() + 6);
        articles = articles.filter(a => {
            const d = new Date(a.pub_date);
            return d >= ws && d <= we;
        });
    } else if (currentPeriod === 'monthly') {
        const ms = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth()+1).padStart(2,'0')}`;
        articles = articles.filter(a => a.pub_date && a.pub_date.startsWith(ms));
    } else if (currentPeriod === 'yearly') {
        // 해당 연도의 기사만 필터링
        const year = selectedDate.getFullYear();
        articles = articles.filter(a => {
            if (!a.pub_date) return false;
            const articleYear = new Date(a.pub_date).getFullYear();
            return articleYear === year;
        });
    }
    
    // 기자별 재집계
    const map = {};
    articles.forEach(a => {
        const n = a.reporter_name;
        if (!map[n]) map[n] = { name: n, articles: [], total_chars: 0 };
        map[n].articles.push(a);
        map[n].total_chars += a.char_count || 0;
    });
    
    let result = Object.values(map).map(r => {
        // 사용자 데이터에서 부서 찾기
        const userInfo = usersData.find(u => u.name === r.name);
        return {
            name: r.name,
            department: userInfo ? userInfo.department : '-',
            article_count: r.articles.length,
            total_chars: r.total_chars,
            avg_chars: r.articles.length > 0 ? Math.round(r.total_chars / r.articles.length) : 0
        };
    });
    
    // 부서 필터
    if (selectedDept) {
        result = result.filter(r => r.department === selectedDept);
    }
    
    // 검색
    if (searchKeyword) {
        const kw = searchKeyword.toLowerCase();
        result = result.filter(r => r.name.toLowerCase().includes(kw));
    }
    
    return result.sort((a, b) => b.article_count - a.article_count);
}

// 테이블 렌더링
function renderTable(reporters) {
    const tbody = document.getElementById('reporterList');
    if (reporters.length === 0) {
        tbody.innerHTML = '<tr><td colspan="16" class="text-center py-4 text-muted">해당 기간에 기사가 없습니다</td></tr>';
        return;
    }
    
    // 평가 데이터 가져오기
    const evals = ScoreDataStore.getEvals();
    
    // 부서 가중치 데이터
    const deptGroups = APP_CONFIG.getDeptGroups();
    
    function getDeptGroup(dept) {
        if (deptGroups.groupA.includes(dept)) return { group: '가', weight: deptGroups.groupAWeight || 1.0 };
        if (deptGroups.groupB.includes(dept)) return { group: '나', weight: deptGroups.groupBWeight || 1.1 };
        return { group: '-', weight: 1.0 };
    }
    
    // 1단계: 각 기자의 절대점수 계산
    const reporterScores = reporters.map(r => {
        const reporterArticles = getReporterArticles(r.name);
        let totalScore = 0;
        let topCount = 0, exclusiveCount = 0, planCount = 0;
        reporterArticles.forEach(article => {
            const evalData = evals[article.nsid] || {};
            const resolvedTopArticle = evalData.isTopArticle !== undefined ? evalData.isTopArticle : (article.is_auto_top || false);
            const scoreData = { page: article.page || article.paper_number || 15, charCount: article.char_count || 0, isTopArticle: resolvedTopArticle };
            getQualityBonusItems().forEach(item => { if (item.id !== 'isTopArticle') scoreData[item.id] = evalData[item.id] || false; });
            totalScore += calculateArticleScore(scoreData).totalScore;
            if (resolvedTopArticle) topCount++;
            if (evalData.isExclusive) exclusiveCount++;
            if (evalData.isPlanned) planCount++;
        });
        const dg = getDeptGroup(r.department);
        return { ...r, absoluteScore: totalScore, group: dg.group, deptWeight: dg.weight, topCount, exclusiveCount, planCount };
    });
    
    // 2단계: 상대평가 전환 (표준편차 기반, 목표 평균 85, 목표 표준편차 7.5)
    const TARGET_MEAN = 85;
    const TARGET_STD = 7.5;
    const absScores = reporterScores.map(r => r.absoluteScore);
    const mean = absScores.length > 0 ? absScores.reduce((a, b) => a + b, 0) / absScores.length : 0;
    const variance = absScores.length > 1 ? absScores.reduce((s, v) => s + Math.pow(v - mean, 2), 0) / absScores.length : 0;
    const std = Math.sqrt(variance);
    
    reporterScores.forEach(r => {
        if (std > 0 && absScores.length > 1) {
            r.relativeScore = Math.round(((r.absoluteScore - mean) / std * TARGET_STD + TARGET_MEAN) * 100) / 100;
        } else {
            r.relativeScore = TARGET_MEAN;
        }
        r.finalScore = Math.round(r.relativeScore * r.deptWeight * 100) / 100;
    });
    
    // 최종점수 기준 정렬
    reporterScores.sort((a, b) => b.finalScore - a.finalScore);
    
    // 통계 표시
    const avgAbs = absScores.length > 0 ? (absScores.reduce((a,b) => a+b, 0) / absScores.length).toFixed(1) : '0';
    
    tbody.innerHTML = reporterScores.map((r, i) => {
        const groupLabel = r.group !== '-' ? `(${r.group}군)` : '';
        const scoreClass = r.finalScore >= 95 ? 'text-danger fw-bold' : (r.finalScore >= 85 ? 'text-primary fw-bold' : '');
        
        return `
        <tr class="reporter-row" onclick="location.href='reporter.html?name=${encodeURIComponent(r.name)}'">
            <td>${i + 1}</td>
            <td><strong>${escapeHtml(r.name)}</strong></td>
            <td class="hide-mobile"><span class="dept-badge">${escapeHtml(r.department)}</span></td>
            <td>${r.article_count}</td>
            <td class="hide-mobile text-center text-muted">-</td>
            <td class="hide-mobile text-center">${r.exclusiveCount || '-'}</td>
            <td class="hide-mobile text-center">${r.topCount || '-'}</td>
            <td class="hide-mobile text-center">${r.planCount || '-'}</td>
            <td class="hide-mobile text-center text-muted">-</td>
            <td class="hide-mobile text-center text-muted">-</td>
            <td class="hide-mobile text-center text-muted">-</td>
            <td>${r.absoluteScore.toFixed(1)}</td>
            <td>${r.relativeScore.toFixed(2)}</td>
            <td class="text-center">×${r.deptWeight} <small class="text-muted">${groupLabel}</small></td>
            <td class="${scoreClass}">${r.finalScore.toFixed(2)}</td>
            <td><button class="btn btn-sm btn-outline-primary">상세</button></td>
        </tr>
    `}).join('');
    
    // 하단에 평균/표준편차 표시
    const relScores = reporterScores.map(r => r.relativeScore);
    const relMean = relScores.length > 0 ? (relScores.reduce((a,b) => a+b, 0) / relScores.length).toFixed(2) : '0';
    tbody.innerHTML += `
        <tr class="table-warning fw-bold">
            <td colspan="11" class="text-end">평균 / 표준편차</td>
            <td>${mean.toFixed(1)} / ${std.toFixed(1)}</td>
            <td>${relMean} / ${TARGET_STD}</td>
            <td colspan="3"></td>
        </tr>
    `;
}

// 기자별 기사 목록 가져오기 (기간 필터 적용)
function getReporterArticles(reporterName) {
    if (!allData) return [];
    
    const reporter = allData.reporters.find(r => r.name === reporterName);
    if (!reporter) return [];
    
    let articles = reporter.articles || [];
    
    // 기간 필터 적용
    if (currentPeriod === 'daily') {
        const ds = formatDate(selectedDate);
        articles = articles.filter(a => a.pub_date === ds);
    } else if (currentPeriod === 'weekly') {
        const ws = getWeekStart(selectedDate);
        const we = new Date(ws); we.setDate(ws.getDate() + 6);
        articles = articles.filter(a => {
            const d = new Date(a.pub_date);
            return d >= ws && d <= we;
        });
    } else if (currentPeriod === 'monthly') {
        const ms = `${selectedDate.getFullYear()}-${String(selectedDate.getMonth()+1).padStart(2,'0')}`;
        articles = articles.filter(a => a.pub_date && a.pub_date.startsWith(ms));
    } else if (currentPeriod === 'yearly') {
        const year = selectedDate.getFullYear();
        articles = articles.filter(a => {
            if (!a.pub_date) return false;
            const articleYear = new Date(a.pub_date).getFullYear();
            return articleYear === year;
        });
    }
    
    return articles;
}

// 날짜 이동
function moveDate(days) {
    selectedDate.setDate(selectedDate.getDate() + days);
    updatePeriodNav();
    updateView(null);
}
function moveMonth(m) {
    selectedDate.setMonth(selectedDate.getMonth() + m);
    updatePeriodNav();
    updateView(null);
}
function moveYear(y) {
    selectedDate.setFullYear(selectedDate.getFullYear() + y);
    updatePeriodNav();
    updateView(null);
}

// 유틸
function formatDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDateKR(d) {
    const days = ['일','월','화','수','목','금','토'];
    return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function getWeekStart(d) {
    const r = new Date(d);
    r.setDate(r.getDate() - r.getDay());
    return r;
}
function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t;
    return d.innerHTML;
}

// 동기화
async function syncData() {
    const btn = document.getElementById('syncBtn');
    SCore.setButtonLoading(btn, true);
    
    try {
        const res = await fetch(APP_CONFIG.SYNC_API_URL + '/');
        if (!res.ok) throw new Error(res.status.toString());
        const result = await res.json();
        
        if (result.success) {
            SCore.toast(`동기화 완료! ${result.total_articles}건의 기사가 업데이트되었습니다.`, 'success');
            setTimeout(() => location.reload(), 1500);
        } else {
            throw new Error(result.error || '동기화 실패');
        }
    } catch (e) {
        SCore.toast(e, 'error');
    } finally {
        SCore.setButtonLoading(btn, false);
    }
}

function showToast(msg, type = 'success') {
    SCore.toast(msg, type === 'danger' ? 'error' : type);
}

function handleSearch() {
    updateView(this.value);
}
