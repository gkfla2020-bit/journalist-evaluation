<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="common.js"></script>
<script src="config.js"></script>
<script>
// 로그인 체크 - admin만 접근 가능
const session = JSON.parse(localStorage.getItem('kpi_session') || 'null');

// 세션 만료 체크 (24시간)
if (session && session.loginTime) {
    const loginTime = new Date(session.loginTime);
    const now = new Date();
    const hoursDiff = (now - loginTime) / (1000 * 60 * 60);
    if (hoursDiff > 24) {
        localStorage.removeItem('kpi_session');
        alert('세션이 만료되었습니다. 다시 로그인해주세요.');
        location.href = 'login.html';
    }
}

if (!session || session.role !== 'admin') {
    location.href = 'login.html';
}
document.getElementById('userInfo').textContent = session.role === 'admin' ? '관리자님' : `${session.name}님`;

function logout() {
    localStorage.removeItem('kpi_session');
    location.href = 'login.html';
}

const EVAL_API_URL = APP_CONFIG.EVAL_API_URL;
const USERS_API_URL = APP_CONFIG.USERS_API_URL;

let allUsers = [];
let departments = [];
let changedUsers = {};

// 초기 로드
document.addEventListener('DOMContentLoaded', loadUsers);

async function loadUsers() {
    SCore.showLoading('데이터를 불러오는 중...');
    SCore.showInlineLoading('userList', 7);
    
    try {
        // 사용자 목록 로드
        const res = await fetch('users.json?t=' + Date.now());
        if (!res.ok) throw new Error(res.status.toString());
        allUsers = await res.json();
        
        // 부서 목록 추출
        departments = [...new Set(allUsers.map(u => u.department).filter(d => d && d !== '전체'))];
        departments.sort();
        
        // 부서 필터 옵션
        updateDeptFilters();
        
        filterUsers();
    } catch (e) {
        console.error('사용자 로드 실패:', e);
        SCore.showError('userList', {
            title: '사원 목록을 불러올 수 없습니다',
            message: SCore.getErrorMessage(e),
            retryCallback: 'loadUsers()',
            colspan: 7
        });
    } finally {
        SCore.hideLoading();
    }
}

function filterUsers() {
    const deptFilter = document.getElementById('deptFilter').value;
    const roleFilter = document.getElementById('roleFilter').value;
    const search = document.getElementById('searchInput').value.toLowerCase();
    
    let filtered = allUsers.filter(u => {
        if (deptFilter && u.department !== deptFilter) return false;
        if (roleFilter && u.role !== roleFilter) return false;
        if (search && !u.name.toLowerCase().includes(search) && !u.id.includes(search)) return false;
        return true;
    });
    
    document.getElementById('userCount').textContent = filtered.length + '명';
    renderTable(filtered);
}

function renderTable(users) {
    const tbody = document.getElementById('userList');
    if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">검색 결과가 없습니다</td></tr>';
        return;
    }
    
    tbody.innerHTML = users.map(u => {
        const roleClass = u.role === 'admin' ? 'role-admin' : (u.role === 'manager' ? 'role-manager' : 'role-reporter');
        const roleText = u.role === 'admin' ? '관리자' : (u.role === 'manager' ? '부장' : '기자');
        const isChanged = changedUsers[u.id] ? 'table-warning' : '';
        
        return `
            <tr class="${isChanged}">
                <td>${u.id}</td>
                <td><strong>${u.name}</strong></td>
                <td>${u.department}</td>
                <td>${u.position || '-'}</td>
                <td><span class="role-badge ${roleClass}">${roleText}</span></td>
                <td><small>${u.email || '-'}</small></td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal('${u.id}')" title="수정">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" onclick="openDeleteModal('${u.id}', '${u.name}')" title="퇴사">
                        <i class="bi bi-person-x"></i>
                    </button>
                </td>
            </tr>
        `;
    }).join('');
}

function openEditModal(userId) {
    const user = allUsers.find(u => u.id === userId);
    if (!user) return;
    
    document.getElementById('editUserId').value = userId;
    document.getElementById('editName').value = user.name;
    document.getElementById('editDept').value = user.department;
    document.getElementById('editPosition').value = user.position || '';
    document.getElementById('editRole').value = user.role;
    
    new bootstrap.Modal(document.getElementById('editModal')).show();
}

function saveUserEdit() {
    const userId = document.getElementById('editUserId').value;
    const newDept = document.getElementById('editDept').value;
    const newPosition = document.getElementById('editPosition').value;
    const newRole = document.getElementById('editRole').value;
    
    // allUsers에서 해당 사용자 찾아서 수정
    const user = allUsers.find(u => u.id === userId);
    if (user) {
        // 부서가 변경된 경우 dept_history에 이력 추가
        if (user.department !== newDept) {
            if (!user.dept_history) {
                // 최초 이력: 기존 부서를 시스템 시작일부터로 기록
                user.dept_history = [{ dept: user.department, from: '2025-12-01' }];
            }
            // 새 부서 이력 추가 (오늘부터)
            const today = new Date().toISOString().slice(0, 10);
            user.dept_history.push({ dept: newDept, from: today });
        }
        user.department = newDept;
        user.position = newPosition;
        user.role = newRole;
        changedUsers[userId] = true;
    }
    
    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    filterUsers();
    showToast('수정되었습니다. "변경사항 저장" 버튼을 눌러 저장하세요.', 'warning');
}

async function saveAllChanges() {
    if (Object.keys(changedUsers).length === 0) {
        SCore.toast('변경된 내용이 없습니다.', 'info');
        return;
    }
    
    const btn = document.querySelector('[onclick="saveAllChanges()"]');
    SCore.setButtonLoading(btn, true);
    
    try {
        // Lambda API로 S3에 직접 저장
        const res = await fetch(USERS_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ users: allUsers })
        });
        
        if (!res.ok) throw new Error(res.status.toString());
        const result = await res.json();
        
        if (result.success) {
            changedUsers = {};
            filterUsers();
            SCore.toast(result.message + ' (캐시 갱신까지 약 10초 소요)', 'success');
        } else {
            throw new Error(result.error || '저장 실패');
        }
    } catch (e) {
        SCore.toast(e, 'error');
    } finally {
        SCore.setButtonLoading(btn, false);
    }
}

function showToast(msg, type = 'success') {
    SCore.toast(msg, type === 'danger' ? 'error' : type);
}

function updateDeptFilters() {
    const deptFilter = document.getElementById('deptFilter');
    const editDept = document.getElementById('editDept');
    const addDept = document.getElementById('addDept');
    
    deptFilter.innerHTML = '<option value="">전체 부서</option>';
    editDept.innerHTML = '';
    addDept.innerHTML = '';
    
    departments.forEach(d => {
        deptFilter.innerHTML += `<option value="${d}">${d}</option>`;
        editDept.innerHTML += `<option value="${d}">${d}</option>`;
        addDept.innerHTML += `<option value="${d}">${d}</option>`;
    });
}

// 사원 추가 모달 열기
function openAddModal() {
    document.getElementById('addId').value = '';
    document.getElementById('addName').value = '';
    document.getElementById('addPosition').value = '기자';
    document.getElementById('addRole').value = 'reporter';
    document.getElementById('addEmail').value = '';
    
    // 부서 옵션 업데이트
    updateDeptFilters();
    
    new bootstrap.Modal(document.getElementById('addModal')).show();
}

// 새 사원 추가
function addNewUser() {
    const id = document.getElementById('addId').value.trim();
    const name = document.getElementById('addName').value.trim();
    const dept = document.getElementById('addDept').value;
    const position = document.getElementById('addPosition').value;
    const role = document.getElementById('addRole').value;
    const email = document.getElementById('addEmail').value.trim();
    
    // 유효성 검사
    if (!id) {
        SCore.toast('사번을 입력하세요.', 'error');
        return;
    }
    if (!/^\d{6}$/.test(id)) {
        SCore.toast('사번은 6자리 숫자여야 합니다.', 'error');
        return;
    }
    if (!name) {
        SCore.toast('이름을 입력하세요.', 'error');
        return;
    }
    if (!dept) {
        SCore.toast('부서를 선택하세요.', 'error');
        return;
    }
    
    // 중복 체크
    if (allUsers.find(u => u.id === id)) {
        SCore.toast('이미 존재하는 사번입니다.', 'error');
        return;
    }
    
    // 새 사원 추가
    const newUser = {
        id: id,
        name: name,
        department: dept,
        position: position,
        role: role,
        email: email,
        password: '1234'
    };
    
    allUsers.push(newUser);
    changedUsers[id] = true;
    
    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
    filterUsers();
    SCore.toast(`${name} 사원이 추가되었습니다. "변경사항 저장"을 눌러주세요.`, 'warning');
}

// 퇴사 모달 열기
function openDeleteModal(userId, userName) {
    document.getElementById('deleteUserId').value = userId;
    document.getElementById('deleteUserName').textContent = `${userName} (${userId})`;
    new bootstrap.Modal(document.getElementById('deleteModal')).show();
}

// 퇴사 확인
function confirmDelete() {
    const userId = document.getElementById('deleteUserId').value;
    const user = allUsers.find(u => u.id === userId);
    
    if (!user) {
        SCore.toast('사원을 찾을 수 없습니다.', 'error');
        return;
    }
    
    // admin은 삭제 불가
    if (user.role === 'admin' && user.id === 'admin') {
        SCore.toast('기본 관리자 계정은 삭제할 수 없습니다.', 'error');
        bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
        return;
    }
    
    // 배열에서 제거
    const idx = allUsers.findIndex(u => u.id === userId);
    if (idx !== -1) {
        allUsers.splice(idx, 1);
        changedUsers['_deleted_' + userId] = true; // 삭제 표시
    }
    
    bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
    filterUsers();
    SCore.toast(`${user.name} 사원이 퇴사 처리되었습니다. "변경사항 저장"을 눌러주세요.`, 'warning');
}
</script>
