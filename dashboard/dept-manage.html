<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부서 관리 - S-CORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; font-family: 'Pretendard', -apple-system, sans-serif; }
        .container-main { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
        .header { background: linear-gradient(135deg, #1a365d 0%, #2c5282 50%, #2b6cb0 100%); color: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
        .card-header { background: #2c5282; color: white; font-weight: 600; border-radius: 12px 12px 0 0 !important; padding: 1rem 1.5rem; }
        .nav-menu { background: white; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .nav-menu a { color: #2c5282; text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; margin-right: 0.5rem; transition: all 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { background: #2c5282; color: white; }
        .btn-outline-light:hover { background: rgba(255,255,255,0.15); }
    </style>
</head>
<body>
<div class="container-main">

<!-- 헤더 -->
<div class="header">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <h1 style="font-size:1.8rem; margin-bottom:0.25rem;"><i class="bi bi-bar-chart-fill me-2"></i>S-CORE</h1>
            <div style="opacity:0.9;">기자 지면 기여도 평가 시스템</div>
        </div>
        <div class="text-end">
            <small id="userInfo" class="me-2"></small>
            <button class="btn btn-sm btn-outline-light" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 로그아웃</button>
        </div>
    </div>
</div>

<!-- 네비게이션 -->
<div class="nav-menu">
    <a href="home.html"><i class="bi bi-house-door me-1"></i>대시보드</a>
    <a href="score-dashboard.html"><i class="bi bi-speedometer2 me-1"></i>부서 대시보드</a>
    <a href="list.html"><i class="bi bi-people me-1"></i>기자 목록</a>
    <a href="score-eval.html"><i class="bi bi-clipboard-check me-1"></i>기사 평가</a>
    <a href="score-penalties.html"><i class="bi bi-plus-slash-minus me-1"></i>가감점 관리</a>
    <a href="score-appeals.html"><i class="bi bi-chat-left-text me-1"></i>소명 관리</a>
    <a href="score-config.html"><i class="bi bi-sliders me-1"></i>가중치 설정</a>
    <a href="admin.html"><i class="bi bi-person-gear me-1"></i>사원 관리</a>
    <a href="dept-manage.html" class="active"><i class="bi bi-building me-1"></i>부서 관리</a>
</div>

<div class="row">
    <!-- 부서 목록 -->
    <div class="col-md-8">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-building me-2"></i>부서 목록</span>
                <button class="btn btn-sm btn-light" onclick="saveChanges()">
                    <i class="bi bi-save me-1"></i>변경사항 저장
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width:35%">부서명</th>
                                <th style="width:15%">소속 인원</th>
                                <th style="width:15%">표시 여부</th>
                                <th style="width:20%">부서장</th>
                                <th style="width:15%">관리</th>
                            </tr>
                        </thead>
                        <tbody id="deptList">
                            <tr><td colspan="5" class="text-center py-4 text-muted">로딩중...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 새 부서 추가 -->
    <div class="col-md-4">
        <div class="card">
            <div class="card-header"><i class="bi bi-plus-circle me-2"></i>새 부서 추가</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">부서명</label>
                    <input type="text" class="form-control" id="newDeptName" placeholder="예: 디지털뉴스부">
                </div>
                <button class="btn btn-primary w-100" onclick="addNewDept()">
                    <i class="bi bi-plus me-1"></i>부서 추가
                </button>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header"><i class="bi bi-info-circle me-2"></i>안내</div>
            <div class="card-body">
                <ul class="small text-muted mb-0">
                    <li class="mb-2"><strong>표시 여부</strong>: 숨김 처리된 부서는 필터 목록에서 제외됩니다.</li>
                    <li class="mb-2"><strong>부서명 변경</strong>: 해당 부서 소속 사원들의 부서명도 함께 변경됩니다.</li>
                    <li><strong>부서 삭제</strong>: 소속 인원이 0명인 부서만 삭제 가능합니다.</li>
                </ul>
            </div>
        </div>
    </div>
</div>

</div>

<!-- 부서 수정 모달 -->
<div class="modal fade" id="editDeptModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-building me-2"></i>부서 정보 수정</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editDeptOldName">
                <div class="mb-3">
                    <label class="form-label fw-bold">부서명</label>
                    <input type="text" class="form-control" id="editDeptNewName">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">표시 여부</label>
                    <select class="form-select" id="editDeptVisible">
                        <option value="true">표시</option>
                        <option value="false">숨김</option>
                    </select>
                </div>
                <div class="alert alert-info small mb-0">
                    <i class="bi bi-info-circle me-1"></i>
                    부서명 변경 시 해당 부서 소속 사원들의 부서명도 함께 변경됩니다.
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" onclick="saveDeptEdit()">저장</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="common.js"></script>
<script src="config.js"></script>
<script src="score-data.js"></script>
<script>
const EVAL_API_URL = APP_CONFIG.EVAL_API_URL;
const USERS_API_URL = APP_CONFIG.USERS_API_URL;

// 로그인 체크
const session = JSON.parse(localStorage.getItem('kpi_session') || 'null');
if (!session || session.role !== 'admin') {
    location.href = 'login.html';
}
document.getElementById('userInfo').textContent = '관리자님';

function logout() {
    localStorage.removeItem('kpi_session');
    location.href = 'login.html';
}

let allUsers = [];
let departments = [];
let deptConfig = {};
let changedUsers = {};
let deptChanged = false;

// 초기 로드
document.addEventListener('DOMContentLoaded', loadData);

async function loadData() {
    SCore.showLoading('데이터를 불러오는 중...');
    
    try {
        const res = await fetch('users.json?t=' + Date.now());
        allUsers = await res.json();
        
        departments = [...new Set(allUsers.map(u => u.department).filter(d => d && d !== '전체'))];
        departments.sort();
        
        // 서버에서 전체 데이터 로드 (부서 설정 포함)
        await ScoreDataStore.loadAllFromServer();
        
        // localStorage에서 부서 설정 가져오기
        const savedDeptConfig = ScoreDataStore.getDeptConfig();
        if (savedDeptConfig && Object.keys(savedDeptConfig).length > 0) {
            deptConfig = savedDeptConfig;
        }
        
        departments.forEach(d => {
            if (!deptConfig[d]) deptConfig[d] = { visible: true };
        });
        
        renderDeptList();
    } catch (e) {
        SCore.toast('데이터 로드 실패', 'error');
    } finally {
        SCore.hideLoading();
    }
}

function renderDeptList() {
    const tbody = document.getElementById('deptList');
    
    tbody.innerHTML = departments.map(d => {
        const count = allUsers.filter(u => u.department === d).length;
        const config = deptConfig[d] || { visible: true };
        const manager = allUsers.find(u => u.department === d && u.role === 'manager');
        const visibleBadge = config.visible !== false 
            ? '<span class="badge bg-success">표시</span>' 
            : '<span class="badge bg-secondary">숨김</span>';
        
        return `
            <tr class="${config.visible === false ? 'table-secondary' : ''}">
                <td><strong>${d}</strong></td>
                <td>${count}명</td>
                <td>${visibleBadge}</td>
                <td>${manager ? manager.name : '<span class="text-muted">-</span>'}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal('${d}')">
                        <i class="bi bi-pencil"></i>
                    </button>
                    ${count === 0 ? `<button class="btn btn-sm btn-outline-danger" onclick="deleteDept('${d}')"><i class="bi bi-trash"></i></button>` : ''}
                </td>
            </tr>
        `;
    }).join('');
}

function openEditModal(deptName) {
    document.getElementById('editDeptOldName').value = deptName;
    document.getElementById('editDeptNewName').value = deptName;
    document.getElementById('editDeptVisible').value = deptConfig[deptName]?.visible !== false ? 'true' : 'false';
    new bootstrap.Modal(document.getElementById('editDeptModal')).show();
}

function saveDeptEdit() {
    const oldName = document.getElementById('editDeptOldName').value;
    const newName = document.getElementById('editDeptNewName').value.trim();
    const visible = document.getElementById('editDeptVisible').value === 'true';
    
    if (!newName) { SCore.toast('부서명을 입력하세요.', 'error'); return; }
    
    if (oldName !== newName) {
        if (departments.includes(newName)) { SCore.toast('이미 존재하는 부서명입니다.', 'error'); return; }
        
        allUsers.forEach(u => {
            if (u.department === oldName) {
                u.department = newName;
                changedUsers[u.id] = true;
            }
        });
        
        const idx = departments.indexOf(oldName);
        if (idx !== -1) departments[idx] = newName;
        
        deptConfig[newName] = deptConfig[oldName] || { visible: true };
        delete deptConfig[oldName];
    }
    
    deptConfig[newName] = deptConfig[newName] || {};
    deptConfig[newName].visible = visible;
    deptChanged = true;
    
    bootstrap.Modal.getInstance(document.getElementById('editDeptModal')).hide();
    renderDeptList();
    SCore.toast('수정되었습니다. "변경사항 저장"을 눌러주세요.', 'warning');
}

function addNewDept() {
    const newName = document.getElementById('newDeptName').value.trim();
    if (!newName) { SCore.toast('부서명을 입력하세요.', 'error'); return; }
    if (departments.includes(newName)) { SCore.toast('이미 존재하는 부서명입니다.', 'error'); return; }
    
    departments.push(newName);
    departments.sort();
    deptConfig[newName] = { visible: true };
    deptChanged = true;
    
    document.getElementById('newDeptName').value = '';
    renderDeptList();
    SCore.toast(`'${newName}' 부서가 추가되었습니다.`, 'warning');
}

function deleteDept(deptName) {
    if (allUsers.filter(u => u.department === deptName).length > 0) {
        SCore.toast('소속 인원이 있는 부서는 삭제할 수 없습니다.', 'error');
        return;
    }
    if (!confirm(`'${deptName}' 부서를 삭제하시겠습니까?`)) return;
    
    departments = departments.filter(d => d !== deptName);
    delete deptConfig[deptName];
    deptChanged = true;
    renderDeptList();
    SCore.toast(`'${deptName}' 부서가 삭제되었습니다.`, 'warning');
}

async function saveChanges() {
    if (!deptChanged && Object.keys(changedUsers).length === 0) {
        SCore.toast('변경된 내용이 없습니다.', 'info');
        return;
    }
    
    const btn = document.querySelector('[onclick="saveChanges()"]');
    SCore.setButtonLoading(btn, true);
    
    try {
        if (deptChanged) {
            // ScoreDataStore를 통해 부서 설정 저장 + 서버 동기화
            ScoreDataStore.saveDeptConfig(deptConfig);
            await ScoreDataStore._syncType('dept_groups', deptConfig);
        }
        
        if (Object.keys(changedUsers).length > 0) {
            await fetch(USERS_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ users: allUsers })
            });
        }
        
        changedUsers = {};
        deptChanged = false;
        SCore.toast('저장되었습니다.', 'success');
    } catch (e) {
        SCore.toast('저장 실패', 'error');
    } finally {
        SCore.setButtonLoading(btn, false);
    }
}
</script>
</body>
</html>
