<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 변경 - S-CORE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f7fa; font-family: 'Pretendard', -apple-system, sans-serif; }
        .card-main { width: 100%; max-width: 460px; border: none; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); overflow: hidden; }
        .card-header-custom { background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%); color: white; padding: 2rem; text-align: center; }
        .card-header-custom h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
        .card-header-custom p { opacity: 0.85; font-size: 0.9rem; margin: 0; }
        .card-body-custom { padding: 2rem; }
        .form-label { font-weight: 600; color: #4a5568; font-size: 0.9rem; }
        .form-control { padding: 0.875rem 1rem; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; }
        .form-control:focus { border-color: #2b6cb0; box-shadow: 0 0 0 3px rgba(43,108,176,0.15); }
        .input-group-text { background: #f7fafc; border: 2px solid #e2e8f0; border-right: none; border-radius: 10px 0 0 10px; color: #718096; }
        .input-group .form-control { border-left: none; border-radius: 0 10px 10px 0; }
        .input-group:focus-within .input-group-text { border-color: #2b6cb0; }
        .btn-change { background: linear-gradient(135deg, #2b6cb0 0%, #2c5282 100%); border: none; padding: 1rem; font-size: 1rem; font-weight: 600; border-radius: 10px; color: white; width: 100%; }
        .btn-change:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(43,108,176,0.35); color: white; }
        .alert { border-radius: 10px; border: none; padding: 1rem; }
        .pw-rules { background: #f7fafc; border-radius: 10px; padding: 1rem; margin-bottom: 1.5rem; border: 1px solid #e2e8f0; }
        .pw-rules li { font-size: 0.85rem; color: #718096; margin-bottom: 0.25rem; }
        .pw-rules li.valid { color: #38a169; }
        .pw-rules li.invalid { color: #e53e3e; }
        .back-link { display: inline-flex; align-items: center; gap: 0.5rem; color: #718096; text-decoration: none; font-size: 0.9rem; margin-top: 1rem; }
        .back-link:hover { color: #2c5282; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spin { display: inline-block; animation: spin 1s linear infinite; }
    </style>
</head>
<body>

<div class="card-main">
    <div class="card-header-custom">
        <i class="bi bi-shield-lock" style="font-size:2.5rem; margin-bottom:0.5rem; display:block;"></i>
        <h2>비밀번호 변경</h2>
        <p>현재 비밀번호를 확인 후 새 비밀번호를 설정합니다</p>
    </div>
    <div class="card-body-custom">
        <div id="alertBox" class="alert d-none" role="alert"></div>
        <div id="userInfoBox" class="text-center mb-3" style="display:none;">
            <span class="badge bg-primary" id="userBadge"></span>
        </div>

        <form id="changeForm">
            <div class="mb-3">
                <label class="form-label">사번</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="userId" placeholder="사번을 입력하세요" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">현재 비밀번호</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="currentPw" placeholder="현재 비밀번호" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">새 비밀번호</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="newPw" placeholder="새 비밀번호" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">새 비밀번호 확인</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirmPw" placeholder="새 비밀번호 다시 입력" required>
                </div>
            </div>

            <ul class="pw-rules list-unstyled mb-3" id="pwRules">
                <li id="ruleLength"><i class="bi bi-circle me-1"></i>4자리 이상</li>
                <li id="ruleMatch"><i class="bi bi-circle me-1"></i>새 비밀번호 일치</li>
                <li id="ruleDiff"><i class="bi bi-circle me-1"></i>현재 비밀번호와 다름</li>
            </ul>

            <button type="submit" class="btn btn-change" id="submitBtn">
                <i class="bi bi-check-circle me-2"></i>비밀번호 변경
            </button>
        </form>

        <div class="text-center">
            <a href="login.html" class="back-link"><i class="bi bi-arrow-left"></i>로그인으로 돌아가기</a>
        </div>
    </div>
</div>

<script src="config.js"></script>
<script>
const USERS_API = APP_CONFIG.USERS_API_URL;
let USERS = [];

// users.json 로드
fetch('users.json?t=' + Date.now()).then(r => r.json()).then(d => { USERS = d; }).catch(() => {});

// 로그인 세션이 있으면 사번 자동 입력
const session = JSON.parse(localStorage.getItem('kpi_session') || 'null');
if (session) {
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('userId').value = session.userId || '';
        const box = document.getElementById('userInfoBox');
        box.style.display = 'block';
        document.getElementById('userBadge').textContent = `${session.name} (${session.department})`;
    });
}

// 실시간 유효성 검사
['newPw', 'confirmPw', 'currentPw'].forEach(id => {
    document.getElementById(id).addEventListener('input', validateRules);
});

function validateRules() {
    const newPw = document.getElementById('newPw').value;
    const confirmPw = document.getElementById('confirmPw').value;
    const currentPw = document.getElementById('currentPw').value;

    setRule('ruleLength', newPw.length >= 4);
    setRule('ruleMatch', newPw.length > 0 && newPw === confirmPw);
    setRule('ruleDiff', newPw.length > 0 && newPw !== currentPw);
}

function setRule(id, valid) {
    const el = document.getElementById(id);
    el.className = valid ? 'valid' : (el.querySelector('input') ? '' : 'invalid');
    const icon = el.querySelector('i');
    if (icon) {
        icon.className = valid ? 'bi bi-check-circle-fill me-1' : 'bi bi-circle me-1';
    }
}

document.getElementById('changeForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const alertBox = document.getElementById('alertBox');
    const btn = document.getElementById('submitBtn');
    const userId = document.getElementById('userId').value.trim();
    const currentPw = document.getElementById('currentPw').value;
    const newPw = document.getElementById('newPw').value;
    const confirmPw = document.getElementById('confirmPw').value;

    alertBox.classList.add('d-none');

    // 유효성 검사
    const user = USERS.find(u => u.id === userId);
    if (!user) { showAlert('사번을 찾을 수 없습니다.', 'danger'); return; }
    if (user.password !== currentPw) { showAlert('현재 비밀번호가 올바르지 않습니다.', 'danger'); return; }
    if (newPw.length < 4) { showAlert('새 비밀번호는 4자리 이상이어야 합니다.', 'danger'); return; }
    if (newPw !== confirmPw) { showAlert('새 비밀번호가 일치하지 않습니다.', 'danger'); return; }
    if (newPw === currentPw) { showAlert('현재 비밀번호와 다른 비밀번호를 입력해주세요.', 'danger'); return; }

    // 변경 요청
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-arrow-repeat spin me-2"></i>변경 중...';

    try {
        // users 배열에서 해당 유저 비밀번호 변경
        const updatedUsers = USERS.map(u => u.id === userId ? { ...u, password: newPw } : u);

        const res = await fetch(USERS_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ users: updatedUsers })
        });
        const result = await res.json();

        if (result.success) {
            USERS = updatedUsers;
            showAlert('비밀번호가 변경되었습니다. 새 비밀번호로 로그인해주세요.', 'success');
            document.getElementById('changeForm').reset();
            // 세션 삭제 (재로그인 유도)
            localStorage.removeItem('kpi_session');
            setTimeout(() => { location.href = 'login.html'; }, 2000);
        } else {
            showAlert('변경 실패: ' + (result.error || '알 수 없는 오류'), 'danger');
        }
    } catch (err) {
        showAlert('서버 오류: ' + err.message, 'danger');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check-circle me-2"></i>비밀번호 변경';
    }
});

function showAlert(msg, type) {
    const box = document.getElementById('alertBox');
    box.className = `alert alert-${type}`;
    box.textContent = msg;
    box.classList.remove('d-none');
}
</script>
</body>
</html>
