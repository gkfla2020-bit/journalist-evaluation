<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기자 상세 - S-CORE</title>
    <!-- Preconnect & Preload for faster loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="data.json" as="fetch" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <style>
        body { background: #f5f7fa; font-family: 'Pretendard', -apple-system, sans-serif; }
        .container-main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .header { background: linear-gradient(135deg, #1a365d 0%, #2c5282 50%, #2b6cb0 100%); color: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; }
        .profile-section { display: flex; align-items: center; gap: 1.5rem; }
        .profile-icon { width: 80px; height: 80px; background: rgba(255,255,255,0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; backdrop-filter: blur(10px); }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 1.5rem; }
        .card-header { background: #2c5282; color: white; font-weight: 600; border-radius: 12px 12px 0 0 !important; }
        .stat-box { background: #f7fafc; border-radius: 8px; padding: 1rem; text-align: center; }
        .stat-box .value { font-size: 2rem; font-weight: 700; color: #2c5282; }
        .stat-box .label { font-size: 0.85rem; color: #718096; }
        .page-badge { display: inline-block; width: 32px; height: 32px; line-height: 32px; text-align: center; border-radius: 6px; font-weight: 700; font-size: 0.9rem; }
        .page-1 { background: #ffd700; color: #333; }
        .page-2-3 { background: #2b6cb0; color: white; }
        .page-other { background: #718096; color: white; }
        .page-grid { display: grid; grid-template-columns: repeat(16, 1fr); gap: 4px; margin: 1rem 0; }
        .page-cell { background: #e2e8f0; border-radius: 4px; padding: 0.3rem; text-align: center; font-size: 0.7rem; font-weight: 600; }
        .page-cell.active { background: #2c5282; color: white; }
        .page-cell.highlight { background: #ffc107; color: #333; }
        .nav-tabs { border-bottom: 2px solid #2c5282; }
        .nav-tabs .nav-link { color: #2c5282; font-weight: 600; padding: 0.75rem 2rem; border: none; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
        .nav-tabs .nav-link:hover { border-color: transparent; background: #ebf4ff; }
        .nav-tabs .nav-link.active { color: white; background: #2c5282; border-bottom: 3px solid #ffc107; border-radius: 8px 8px 0 0; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .loading { text-align: center; padding: 3rem; color: #718096; }
        .edit-page i, .edit-chars i { pointer-events: none; }
        .nav-menu { background: white; border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .nav-menu a { color: #2c5282; text-decoration: none; padding: 0.5rem 1rem; border-radius: 8px; margin-right: 0.5rem; transition: all 0.2s; }
        .nav-menu a:hover { background: #2c5282; color: white; }
        .chart-container { position: relative; height: 200px; }
        .btn-outline-secondary { border-color: #cbd5e0; color: #4a5568; }
        .btn-outline-secondary:hover { background: #2c5282; border-color: #2c5282; color: white; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spin { display: inline-block; animation: spin 1s linear infinite; }
        /* 품질 가점 버튼 (score-eval.html과 동일) */
        .quality-btn { 
            padding: 0.25rem 0.5rem; border-radius: 6px; font-size: 0.7rem; font-weight: 600;
            border: 2px solid #e2e8f0; background: white; color: #718096; cursor: pointer;
            transition: all 0.2s; margin-right: 0.15rem; margin-bottom: 0.15rem;
        }
        .quality-btn:hover { border-color: #2c5282; color: #2c5282; }
        .quality-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .quality-btn:disabled:hover { border-color: inherit; color: inherit; }
        .quality-btn.active { background: #2c5282; border-color: #2c5282; color: white; }
        .quality-btn.top.active { background: #f59e0b; border-color: #f59e0b; }
        .quality-btn.exclusive.active { background: #ef4444; border-color: #ef4444; }
        .quality-btn.feature.active { background: #8b5cf6; border-color: #8b5cf6; }
        .quality-btn.sgrade.active { background: #10b981; border-color: #10b981; }
        .quality-btn.agrade.active { background: #3b82f6; border-color: #3b82f6; }
        .quality-btn.custom.active { background: #6366f1; border-color: #6366f1; }
    </style>
</head>
<body>
<div class="container-main">

<!-- 토스트 메시지 -->
<div class="toast-container">
    <div id="saveToast" class="toast align-items-center text-bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body"><i class="bi bi-check-circle me-2"></i>저장되었습니다</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- 네비게이션 -->
<div class="nav-menu" id="navMenu">
    <a href="home.html" id="navHome"><i class="bi bi-house-door me-1"></i>대시보드</a>
    <a href="list.html"><i class="bi bi-people me-1"></i>기자 목록</a>
    <a href="score-eval.html" id="navScoreEval"><i class="bi bi-clipboard-check me-1"></i>기사 평가</a>
    <a href="score-penalties.html" id="navPenalties"><i class="bi bi-plus-slash-minus me-1"></i>가감점 관리</a>
    <a href="score-appeals.html" id="navAppeals"><i class="bi bi-chat-left-text me-1"></i>소명 관리</a>
    <span class="float-end">
        <small id="userInfo" class="me-2 text-muted"></small>
        <button class="btn btn-sm btn-outline-secondary" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 로그아웃</button>
    </span>
</div>

<!-- 헤더 -->
<div class="header">
    <div class="profile-section">
        <div class="profile-icon"><i class="bi bi-person-fill"></i></div>
        <div>
            <h1 style="font-size:1.8rem; margin-bottom:0.25rem;" id="reporterName">기자명</h1>
            <div style="opacity:0.9;" id="reporterDept">
                <span id="positionText">기자</span>
                <span id="editPositionBtn" style="cursor:pointer;" onclick="editPosition()" title="클릭하여 직위 수정">
                    <i class="bi bi-pencil-fill ms-1" style="font-size:0.7rem;"></i>
                </span>
            </div>

        <div class="ms-auto text-end">
            <div class="small opacity-75">조회 기간</div>
            <div class="fw-bold" id="currentPeriod">-</div>
        </div>
    </div>
</div>

<!-- 기간 선택 탭 -->
<ul class="nav nav-tabs mb-3" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-period="daily" type="button">일별</button></li>
    <li class="nav-item"><button class="nav-link" data-period="weekly" type="button">주별</button></li>
    <li class="nav-item"><button class="nav-link" data-period="monthly" type="button">월별</button></li>
    <li class="nav-item"><button class="nav-link" data-period="quarterly" type="button">분기별</button></li>
    <li class="nav-item"><button class="nav-link" data-period="halfyear" type="button">반기별</button></li>
    <li class="nav-item"><button class="nav-link" data-period="yearly" type="button">연간</button></li>

</ul>

<!-- 날짜 네비게이션 -->
<div class="d-flex justify-content-center align-items-center mb-4" id="dateNav">
    <button class="btn btn-outline-secondary btn-sm me-3" id="prevBtn" onclick="navigatePeriod(-1)">
        <i class="bi bi-chevron-left"></i> 이전

    <span class="fw-bold fs-5" id="navPeriodText">-</span>
    <button class="btn btn-outline-secondary btn-sm ms-3" id="nextBtn" onclick="navigatePeriod(1)">

</div>

<!-- 메인 컨텐츠 영역 -->
<div id="mainContent">
    <div class="loading"><i class="bi bi-arrow-repeat"></i> 데이터 로딩중...</div>
</div>

<!-- 하단 버튼 -->
<div class="d-flex justify-content-between mt-4" id="bottomButtons">
    <a href="list.html" class="btn btn-outline-secondary" id="backToListBtn"><i class="bi bi-arrow-left me-1"></i>기자 목록</a>
    <div>
        <button class="btn btn-success me-2" onclick="exportExcel()"><i class="bi bi-file-earmark-excel me-1"></i>엑셀</button>
        <button class="btn btn-primary" onclick="window.print()"><i class="bi bi-printer me-1"></i>인쇄</button>
    </div>
</div>

<!-- 검토요청 모달 (기자용) -->
<div class="modal fade" id="appealModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header" style="background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%); color: white;">
                <h5 class="modal-title"><i class="bi bi-chat-left-text me-2"></i>검토 요청</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">기사 제목</label>
                    <p id="appealArticleTitle" class="text-muted"></p>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">요청 유형</label>
                    <select class="form-select" id="appealType">
                        <option value="">선택하세요</option>
                        <option value="EXCLUSIVE">단독 인정 요청</option>
                        <option value="FEATURE">기획/특종 인정 요청</option>
                        <option value="TOP_ARTICLE">톱기사 인정 요청</option>

                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">요청 사유</label>
                    <textarea class="form-control" id="appealReason" rows="4" placeholder="검토 요청 사유를 상세히 작성해주세요..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" onclick="submitAppeal()"><i class="bi bi-send me-1"></i>요청 제출</button>

<input type="hidden" id="appealNsid" value="">
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<!-- S-CORE 점수 모듈 -->
<script src="config.js"></script>
<script src="score.js"></script>
<script src="score-data.js"></script>
<script>
// 로그인 체크
const session = JSON.parse(localStorage.getItem('kpi_session') || 'null');
if (!session) {
    location.href = 'login.html';
}

// 세션 만료 체크 (24시간)
if (session && session.loginTime) {
    const loginTime = new Date(session.loginTime);
    const now = new Date();
    const hoursDiff = (now - loginTime) / (1000 * 60 * 60);
    if (hoursDiff > 24) {
        localStorage.removeItem('kpi_session');
        alert('세션이 만료되었습니다. 다시 로그인해주세요.');
        location.href = 'login.html';
    }
}

const isAdmin = session && session.role === 'admin';
const isManager = session && session.role === 'manager';
const isReporter = session && session.role === 'reporter';
// admin과 manager는 평가 가능
const canEvaluate = isAdmin || isManager;

// 기자 본인이면 네비게이션 숨기기 (대시보드/기자목록 접근 불가)
if (isReporter) {
    document.getElementById('navMenu').innerHTML = `
        <span class="text-muted"><i class="bi bi-person-circle me-1"></i>내 실적 조회</span>
        <span class="float-end">
            <small class="me-2 text-muted">${session.name}님</small>
            <button class="btn btn-sm btn-outline-secondary" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 로그아웃</button>
        </span>
    `;
    // 직위 수정 버튼 숨기기
    const editBtn = document.getElementById('editPositionBtn');
    if (editBtn) editBtn.style.display = 'none';
    // 하단 기자목록 버튼 숨기기
    const backBtn = document.getElementById('backToListBtn');
    if (backBtn) backBtn.style.display = 'none';
    // 기사평가, 소명관리 링크 숨기기
    const navScoreEval = document.getElementById('navScoreEval');
    const navAppeals = document.getElementById('navAppeals');
    if (navScoreEval) navScoreEval.style.display = 'none';
    if (navAppeals) navAppeals.style.display = 'none';
    // "내 점수" 탭 표시
    const myScoreTab = document.getElementById('myScoreTab');
    if (myScoreTab) myScoreTab.style.display = 'block';
} else if (isManager) {
    // manager는 대시보드 링크 숨기고 부서 기자목록으로 연결
    document.getElementById('navMenu').innerHTML = `
        <a href="list.html?dept=${encodeURIComponent(session.department)}"><i class="bi bi-people me-1"></i>기자 목록</a>
        <span class="float-end">
            <small class="me-2 text-muted">${session.name}님 (${session.department})</small>
            <button class="btn btn-sm btn-outline-secondary" onclick="logout()"><i class="bi bi-box-arrow-right"></i> 로그아웃</button>
        </span>
    `;
    // 하단 버튼도 부서 목록으로
    const backBtn = document.getElementById('backToListBtn');
    if (backBtn) backBtn.href = 'list.html?dept=' + encodeURIComponent(session.department);
} else {
    document.getElementById('userInfo').textContent = session ? session.name + '님' : '';
}

function logout() {
    localStorage.removeItem('kpi_session');
    location.href = 'login.html';
}

// URL에서 기자명 가져오기
const urlParams = new URLSearchParams(window.location.search);
const reporterName = urlParams.get('name') || '';

// 기자 본인은 자기 페이지만 접근 가능
if (isReporter && reporterName !== session.name) {
    location.href = 'reporter.html?name=' + encodeURIComponent(session.name);
}

// manager는 자기 부서 기자만 접근 가능 (데이터 로드 후 체크)
let managerDeptCheck = false;

let currentPeriod = 'daily';
let allData = null;
let reporterData = null;
let selectedDate = new Date(); // 현재 선택된 날짜 (네비게이션용)

// localStorage 키 (ScoreDataStore와 동일한 키 사용)
const STORAGE_KEY = ScoreDataStore.EVALS_KEY;
const EVAL_API_URL = APP_CONFIG.EVAL_API_URL;

// 초기화
document.getElementById('reporterName').textContent = reporterName + ' 기자';
document.title = `기자 상세 - ${reporterName}`;

// 탭 클릭 이벤트
document.querySelectorAll('.nav-link').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentPeriod = this.dataset.period;
        selectedDate = new Date(); // 탭 변경시 오늘 날짜로 리셋
        
        // 날짜 네비게이션 표시/숨김
        const dateNav = document.getElementById('dateNav');
        if (currentPeriod === 'myscore') {
            dateNav.style.display = 'none';
        } else {
            dateNav.style.display = 'flex';
        }
        
        renderContent();
        updateNavText();
    });
});

// 날짜 네비게이션
function navigatePeriod(direction) {
    switch (currentPeriod) {
        case 'daily':
            selectedDate.setDate(selectedDate.getDate() + direction);
            break;
        case 'weekly':
            selectedDate.setDate(selectedDate.getDate() + (direction * 7));
            break;
        case 'monthly':
            selectedDate.setMonth(selectedDate.getMonth() + direction);
            break;
        case 'quarterly':
            selectedDate.setMonth(selectedDate.getMonth() + (direction * 3));
            break;
        case 'halfyear':
            selectedDate.setMonth(selectedDate.getMonth() + (direction * 6));
            break;
        case 'yearly':
            selectedDate.setFullYear(selectedDate.getFullYear() + direction);
            break;
    }
    renderContent();
    updateNavText();
}

// 네비게이션 텍스트 업데이트
function updateNavText() {
    document.getElementById('navPeriodText').textContent = getPeriodText();
    // 연간 탭일 때는 이전/다음 연도 네비게이션 표시
    const dateNav = document.getElementById('dateNav');
    if (currentPeriod === 'yearly') {
        dateNav.querySelector('#prevBtn').style.display = '';
        dateNav.querySelector('#nextBtn').style.display = '';
    } else {
        dateNav.querySelector('#prevBtn').style.display = '';
        dateNav.querySelector('#nextBtn').style.display = '';
    }
}

// 데이터 로드
async function loadData() {
    document.getElementById('mainContent').innerHTML = '<div class="loading"><i class="bi bi-arrow-repeat spin"></i> 데이터 로딩중...</div>';
    
    try {
        const res = await fetch('data.json?t=' + Date.now());
        allData = await res.json();
        
        // 해당 기자 데이터 찾기
        reporterData = allData.reporters.find(r => r.name === reporterName);
        
        if (!reporterData) {
            document.getElementById('mainContent').innerHTML = '<div class="p-4 text-danger text-center">해당 기자를 찾을 수 없습니다. <a href="list.html">기자 목록</a>에서 선택해주세요.</div>';
            return;
        }
        
        // manager는 자기 부서 기자만 접근 가능
        if (isManager && !managerDeptCheck) {
            try {
                const usersRes = await fetch('users.json?t=' + Date.now());
                const users = await usersRes.json();
                const targetUser = users.find(u => u.name === reporterName);
                if (targetUser && targetUser.department !== session.department) {
                    alert('다른 부서 기자의 정보는 조회할 수 없습니다.');
                    location.href = 'list.html?dept=' + encodeURIComponent(session.department);
                    return;
                }
                managerDeptCheck = true;
            } catch (e) {
                console.error('부서 체크 실패:', e);
            }
        }
        
        // localStorage에서 저장된 평가 데이터 불러오기
        await loadSavedEvaluations();
        
        // 컨텐츠 렌더링
        renderContent();
        
    } catch (err) {
        console.error(err);
        document.getElementById('mainContent').innerHTML = '<div class="p-4 text-danger text-center">데이터 로드 실패</div>';
    }
}

// 서버에서 평가 데이터 불러오기
async function loadSavedEvaluations() {
    try {
        const res = await fetch(EVAL_API_URL + '?t=' + Date.now());
        if (res.ok) {
            const serverData = await res.json();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(serverData));
            reporterData.articles.forEach(article => {
                if (serverData[article.nsid]) {
                    Object.assign(article, serverData[article.nsid]);
                }
            });
            return;
        }
    } catch (e) { /* 서버 실패 시 localStorage 사용 */ }
    
    // 서버 실패시 localStorage 사용
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        const evaluations = JSON.parse(saved);
        reporterData.articles.forEach(article => {
            if (evaluations[article.nsid]) {
                Object.assign(article, evaluations[article.nsid]);
            }
        });
    }
}

// 평가 데이터 저장 (localStorage + 서버)
async function saveEvaluation(nsid, data) {
    // localStorage에 저장
    const saved = localStorage.getItem(STORAGE_KEY);
    const evaluations = saved ? JSON.parse(saved) : {};
    evaluations[nsid] = { ...evaluations[nsid], ...data };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(evaluations));
    
    // 서버에도 저장
    try {
        const payload = {};
        payload[nsid] = evaluations[nsid];
        await fetch(EVAL_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    } catch (e) {
        console.log('서버 저장 실패:', e);
    }
}

// 통계만 업데이트 (테이블 다시 안 그림)
function updateStats() {
    const articles = getFilteredArticles();
    const stats = {
        article_count: articles.length,
        total_chars: articles.reduce((sum, a) => sum + (a.char_count || 0), 0),
        scoop_count: articles.filter(a => a.coverage_type === '특종').length,
        exclusive_count: articles.filter(a => a.coverage_type === '단독').length,
        s_grade: articles.filter(a => a.impact_grade === 'S').length,
        a_grade: articles.filter(a => a.impact_grade === 'A').length
    };

// 일별 기사수 차트 렌더링
let dailyChart = null;
function renderDailyChart() {
    if (!reporterData || !reporterData.articles) return;
    
    // 일별 집계
    const dailyCount = {};
    reporterData.articles.forEach(a => {
        const date = a.pub_date;
        if (date) {
            dailyCount[date] = (dailyCount[date] || 0) + 1;
        }
    });
    
    // 최근 14일 연속 날짜 생성
    const today = new Date();
    const allDates = [];
    for (let i = 13; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        allDates.push(d.toISOString().slice(0, 10));
    }
    
    const labels = allDates.map(d => {
        const dayOfWeek = new Date(d).getDay();
        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
        return d.slice(5) + '(' + dayNames[dayOfWeek] + ')';
    });
    const data = allDates.map(d => dailyCount[d] || 0);
    
    // 일요일 표시용 배경색
    const bgColors = allDates.map(d => {
        const dayOfWeek = new Date(d).getDay();
        return dayOfWeek === 0 ? '#cbd5e0' : '#2c5282';
    });
    
    const ctx = document.getElementById('dailyChart');
    if (!ctx) return;
    
    if (dailyChart) dailyChart.destroy();
    
    dailyChart = new Chart(ctx.getContext('2d'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: '기사수',
                data: data,
                backgroundColor: bgColors,
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: { 
                    beginAtZero: true,
                    ticks: { stepSize: 1 }
                }
            }
        }
    });
}

// 면별 그리드 렌더링
function renderPageGrid(dist, start, end) {
    let html = '';
    for (let i = start; i <= end; i++) {
        const count = dist[i] || 0;
        let cellClass = 'page-cell';
        if (i === 1 && count > 0) cellClass += ' highlight';
        else if (count > 0) cellClass += ' active';
        html += `<div class="${cellClass}">${i}면<br>${count > 0 ? '<b>' + count + '</b>' : '0'}</div>`;
    }
    return html;
}

// 기간 라벨
function getPeriodLabel() {
    const labels = { daily: '일별', weekly: '주별', monthly: '월별', quarterly: '분기별', halfyear: '반기별' };
    return labels[currentPeriod] || '기간별';
}

// 기간별 필터링된 기사 가져오기
function getFilteredArticles() {
    if (!reporterData || !reporterData.articles) return [];
    
    const articles = reporterData.articles;
    const baseDate = selectedDate;
    
    switch (currentPeriod) {
        case 'all':
            return articles;
        case 'daily': {
            const dateStr = formatDate(baseDate);
            return articles.filter(a => a.pub_date === dateStr);
        }
        case 'weekly': {
            const weekStart = new Date(baseDate);
            weekStart.setDate(baseDate.getDate() - baseDate.getDay()); // 일요일 시작
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 6);
            return articles.filter(a => {
                const d = new Date(a.pub_date);
                return d >= weekStart && d <= weekEnd;
            });
        }
        case 'monthly': {
            const monthStr = `${baseDate.getFullYear()}-${String(baseDate.getMonth() + 1).padStart(2, '0')}`;
            return articles.filter(a => a.pub_date && a.pub_date.startsWith(monthStr));
        }
        case 'quarterly': {
            const quarter = Math.floor(baseDate.getMonth() / 3);
            const qStart = new Date(baseDate.getFullYear(), quarter * 3, 1);
            const qEnd = new Date(baseDate.getFullYear(), quarter * 3 + 3, 0);
            return articles.filter(a => {
                const d = new Date(a.pub_date);
                return d >= qStart && d <= qEnd;
            });
        }
        case 'halfyear': {
            const half = baseDate.getMonth() < 6 ? 0 : 1;
            const hStart = new Date(baseDate.getFullYear(), half * 6, 1);
            const hEnd = new Date(baseDate.getFullYear(), half * 6 + 6, 0);
            return articles.filter(a => {
                const d = new Date(a.pub_date);
                return d >= hStart && d <= hEnd;
            });
        }
        case 'yearly': {
            // 해당 연도의 기사만 필터링
            const year = baseDate.getFullYear();
            const yearStart = new Date(year, 0, 1);
            const yearEnd = new Date(year, 11, 31);
            return articles.filter(a => {
                const d = new Date(a.pub_date);
                return d >= yearStart && d <= yearEnd;
            });
        }
        default:
            return articles;
    }
}

// 기간 텍스트 표시
function getPeriodText() {
    const baseDate = selectedDate;
    
    switch (currentPeriod) {
        case 'yearly':
            return `${baseDate.getFullYear()}년`;
        case 'daily':
            return formatDate(baseDate);
        case 'weekly': {
            const weekStart = new Date(baseDate);
            weekStart.setDate(baseDate.getDate() - baseDate.getDay());
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 6);
            return `${formatDate(weekStart)} ~ ${formatDate(weekEnd)}`;
        }
        case 'monthly':
            return `${baseDate.getFullYear()}년 ${baseDate.getMonth() + 1}월`;
        case 'quarterly': {
            const quarter = Math.floor(baseDate.getMonth() / 3) + 1;
            return `${baseDate.getFullYear()}년 ${quarter}분기`;
        }
        case 'halfyear': {
            const half = baseDate.getMonth() < 6 ? '상반기' : '하반기';
            return `${baseDate.getFullYear()}년 ${half}`;
        }
        default:
            return `${baseDate.getFullYear()}년`;
    }
}

// 날짜 포맷
function formatDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// 품질 가점 토글 (reporter.html용)
async function toggleQualityReporter(nsid, field) {
    if (ScoreDataStore.isConfirmed(nsid)) {
        showToast('확정된 기사는 수정할 수 없습니다', 'warning');
        return;
    }
    
    const evals = ScoreDataStore.getEvals();
    const current = evals[nsid] || {};
    const newValue = !current[field];
    
    ScoreDataStore.saveEval(nsid, { [field]: newValue });
    
    // Lambda API에도 저장
    try {
        const payload = {};
        payload[nsid] = { ...current, [field]: newValue, updatedAt: new Date().toISOString() };
        await fetch(EVAL_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    } catch (e) {
        console.log('서버 저장 실패:', e);
    }
    
    // 테이블 다시 렌더링
    renderContent();
    showToast('저장되었습니다');
}

            scoreInput[item.id] = evalData?.[item.id] || false;
        });
        const scoreResult = calculateArticleScore(scoreInput);
        totalScore += scoreResult.totalScore;
        
        const scoreColor = scoreResult.totalScore >= 15 ? '#dc3545' : (scoreResult.totalScore >= 10 ? '#fd7e14' : '#2c5282');
        
        // 점수 상세 내역 (동적 품질 가점)
        const config = getScoreConfig();
        let bonusItems = [];
        config.QUALITY_BONUS.forEach(qb => {
            if (scoreInput[qb.id]) bonusItems.push(qb.label + '+' + qb.points);
        });
        const bonusStr = bonusItems.length > 0 ? ' + ' + bonusItems.join('+') : '';
        
        // 기본적으로 모든 기사는 확정 상태 (자동 점수 산정)
        const confirmBadge = '<span class="badge bg-success" style="font-size:0.65rem;">확정</span>';
        
        const scoreDetail = `
            <div style="font-size:0.7rem; color:#666;">
                기본 ${scoreResult.baseScore}${bonusStr}
            </div>
            <div>
                <span style="font-weight:700; color:${scoreColor}; font-size:1rem;">= ${scoreResult.totalScore}점</span>
                ${confirmBadge}
            </div>
        `;
        
        // 배지 생성 (동적 품질 가점 항목)
        let badges = '';
        if (scoreInput.isTopArticle) badges += `<span class="badge bg-warning text-dark me-1" title="면톱 기사">${article.is_auto_top ? '🏅톱(자동)' : '🏅톱'}</span>`;
        if (!scoreInput.isTopArticle && article.is_auto_top) badges += `<span class="badge bg-secondary me-1" style="text-decoration:line-through;">톱(자동해제)</span>`;
        config.QUALITY_BONUS.forEach(qb => {
            if (qb.id === 'isTopArticle') return; // 면톱은 위에서 처리
            if (scoreInput[qb.id]) badges += `<span class="badge bg-primary me-1" title="${qb.label}">${qb.icon}${qb.label}</span>`;
        });
        
        // 검토요청 상태 확인
        const appeals = ScoreDataStore ? ScoreDataStore.getAppeals({ reporterId: session.userId }) : [];
        const existingAppeal = appeals.find(a => a.nsid === article.nsid);
        let actionHtml = '';
        if (existingAppeal) {
            const statusBadge = existingAppeal.status === 'SUBMITTED' ? '<span class="badge bg-secondary">검토중</span>' :
                               existingAppeal.status === 'APPROVED' ? '<span class="badge bg-success">승인됨</span>' :
                               '<span class="badge bg-danger">반려됨</span>';
            actionHtml = statusBadge;
        } else {
            actionHtml = `<button class="btn btn-sm btn-outline-secondary appeal-btn" data-nsid="${article.nsid}" data-title="${escapeHtml(article.title || '')}">검토요청</button>`;
        }
        
        const isHighlight = article.paper_number >= 1 && article.paper_number <= 3 ? 'style="background:#fffbeb;"' : '';
        
        html += `
            <tr ${isHighlight}>
                <td>
                    <a href="${article.url || '#'}" target="_blank" class="text-decoration-none fw-bold" style="font-size:0.9rem;">${escapeHtml(article.title || '')}</a>
                    <br><small class="text-muted">${article.pub_date || ''}</small>
                </td>
                <td style="text-align:center; font-weight:600;">${article.paper_number || '-'}면</td>
                <td style="text-align:center;">${article.char_count ? article.char_count.toLocaleString() : '-'}</td>
                <td style="text-align:center;">${scoreDetail}</td>
                <td style="text-align:center;">${badges || '<span class="text-muted">-</span>'}</td>
                <td style="text-align:center;">${actionHtml}</td>
            </tr>
        `;
    });
    
    // 합계 행 추가
    if (articles.length > 0) {
        html += `
            <tr class="table-primary" style="font-weight:700;">
                <td colspan="3" style="text-align:right;">기간 합계 (${articles.length}건)</td>
                <td style="text-align:center; font-size:1.2rem; color:#dc3545;">${Math.round(totalScore * 10) / 10}점</td>
                <td colspan="2"></td>
            </tr>
        `;
    }
    
    html += '</tbody></table>';
    return html;
}
</script>

<script>
// 저장 버튼 이벤트 바인딩
function bindSaveEvents() {
    // 검토요청 버튼 (기자용)
    document.querySelectorAll('.appeal-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const nsid = this.dataset.nsid;
            const title = this.dataset.title;
            document.getElementById('appealNsid').value = nsid;
            document.getElementById('appealArticleTitle').textContent = title;
            document.getElementById('appealType').value = '';
            document.getElementById('appealReason').value = '';
            new bootstrap.Modal(document.getElementById('appealModal')).show();
        });
    });
    
    // 저장 버튼 (더 이상 사용하지 않음 - 버튼 토글 방식으로 자동 저장)
    
    // 면 수정 버튼
    document.querySelectorAll('.edit-page').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const td = this.closest('td');
            const badge = td.querySelector('.page-badge');
            const currentVal = badge ? badge.textContent.trim() : '0';
            
            const originalHTML = td.innerHTML;
            td.innerHTML = `
                <input type="number" class="form-control form-control-sm d-inline-block" value="${currentVal === '-' ? 0 : currentVal}" style="width:50px;" min="0" max="32">
                <button type="button" class="btn btn-sm btn-success ms-1 edit-page-save"><i class="bi bi-check"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary ms-1 edit-page-cancel"><i class="bi bi-x"></i></button>
            `;
            td.dataset.originalHtml = originalHTML;
            td.querySelector('input').focus();
        });
    });
    
    // 글자수 수정 버튼
    document.querySelectorAll('.edit-chars').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const td = this.closest('td');
            const currentText = td.textContent.trim();
            const currentVal = currentText.replace(/[^0-9]/g, '') || '0';
            
            const originalHTML = td.innerHTML;
            td.innerHTML = `
                <input type="number" class="form-control form-control-sm d-inline-block" value="${currentVal}" style="width:80px;" min="0">
                <button type="button" class="btn btn-sm btn-success ms-1 edit-chars-save"><i class="bi bi-check"></i></button>
                <button type="button" class="btn btn-sm btn-outline-secondary ms-1 edit-chars-cancel"><i class="bi bi-x"></i></button>
            `;
            td.dataset.originalHtml = originalHTML;
            td.querySelector('input').focus();
        });
    });
}

// 전역 클릭 이벤트 (동적 버튼용)
document.addEventListener('click', function(e) {
    // 면 수정 저장
    if (e.target.closest('.edit-page-save')) {
        const td = e.target.closest('td');
        const row = td.closest('tr');
        const nsid = row.dataset.nsid;
        const input = td.querySelector('input');
        const newVal = parseInt(input.value) || 0;
        
        // localStorage에 저장
        saveEvaluation(nsid, { paper_number: newVal });
        
        // 기자 데이터에도 반영
        const article = reporterData.articles.find(a => a.nsid === nsid);
        if (article) {
            article.paper_number = newVal;
        }
        
        const pageClass = newVal == 1 ? 'page-1' : (newVal <= 3 ? 'page-2-3' : 'page-other');
        td.innerHTML = `<span class="page-badge ${pageClass}">${newVal}</span> <button type="button" class="btn btn-link btn-sm p-0 text-muted edit-page" title="수정"><i class="bi bi-pencil" style="font-size:0.7rem;"></i></button>`;
        showToast('면이 수정되었습니다');
        bindSaveEvents();
        
        // 면별 분포 업데이트
        renderContent();
    }
    
    // 면 수정 취소
    if (e.target.closest('.edit-page-cancel')) {
        const td = e.target.closest('td');
        td.innerHTML = td.dataset.originalHtml || '';
        bindSaveEvents();
    }
    
    // 글자수 수정 저장
    if (e.target.closest('.edit-chars-save')) {
        const td = e.target.closest('td');
        const row = td.closest('tr');
        const nsid = row.dataset.nsid;
        const input = td.querySelector('input');
        const newVal = parseInt(input.value) || 0;
        
        // localStorage에 저장
        saveEvaluation(nsid, { char_count: newVal });
        
        // 기자 데이터에도 반영
        const article = reporterData.articles.find(a => a.nsid === nsid);
        if (article) {
            article.char_count = newVal;
        }
        
        td.innerHTML = `${newVal.toLocaleString()} <button type="button" class="btn btn-link btn-sm p-0 text-muted edit-chars" title="수정"><i class="bi bi-pencil" style="font-size:0.7rem;"></i></button>`;
        showToast('글자수가 수정되었습니다');
        bindSaveEvents();
        
        // 통계 업데이트
        renderContent();
    }
    
    // 글자수 수정 취소
    if (e.target.closest('.edit-chars-cancel')) {
        const td = e.target.closest('td');
        td.innerHTML = td.dataset.originalHtml || '';
        bindSaveEvents();
    }
});

// 토스트 표시
function showToast(message) {
    const toastEl = document.getElementById('saveToast');
    toastEl.querySelector('.toast-body').innerHTML = '<i class="bi bi-check-circle me-2"></i>' + message;
    const toast = new bootstrap.Toast(toastEl, { delay: 2000 });
    toast.show();
}

// HTML 이스케이프
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// 엑셀 내보내기
function exportExcel() {
    const articles = getFilteredArticles();
    if (articles.length === 0) {
        alert('내보낼 기사가 없습니다.');
        return;
    }
    
    // 엑셀 데이터 준비
    const excelData = articles.map((a, i) => ({
        '번호': i + 1,
        '날짜': a.pub_date || '',
        '제목': a.title || '',
        '면': a.paper_number || '',
        '글자수': a.char_count || 0,
        '위치': a.position || '',
        '취재유형': a.coverage_type || '',
        '기사성격': a.article_nature || '',
        '임팩트등급': a.impact_grade || '',
        'URL': a.url || ''
    }));
    
    // 통계 요약 행 추가
    const stats = {
        article_count: articles.length,
        total_chars: articles.reduce((sum, a) => sum + (a.char_count || 0), 0),
        scoop_count: articles.filter(a => a.coverage_type === '특종').length,
        exclusive_count: articles.filter(a => a.coverage_type === '단독').length,
        s_grade: articles.filter(a => a.impact_grade === 'S').length,
        a_grade: articles.filter(a => a.impact_grade === 'A').length
    };
    
    // 워크북 생성
    const wb = XLSX.utils.book_new();
    
    // 기사 목록 시트
    const ws = XLSX.utils.json_to_sheet(excelData);
    
    // 컬럼 너비 설정
    ws['!cols'] = [
        { wch: 5 },   // 번호
        { wch: 12 },  // 날짜
        { wch: 50 },  // 제목
        { wch: 5 },   // 면
        { wch: 8 },   // 글자수
        { wch: 10 },  // 위치
        { wch: 10 },  // 취재유형
        { wch: 10 },  // 기사성격
        { wch: 10 },  // 임팩트등급
        { wch: 40 }   // URL
    ];
    
    XLSX.utils.book_append_sheet(wb, ws, '기사목록');
    
    // 요약 시트
    const summaryData = [
        { '항목': '기자명', '값': reporterName },
        { '항목': '조회기간', '값': getPeriodText() },
        { '항목': '기사건수', '값': stats.article_count },
        { '항목': '총글자수', '값': stats.total_chars },
        { '항목': '평균글자수', '값': stats.article_count > 0 ? Math.round(stats.total_chars / stats.article_count) : 0 },
        { '항목': '특종', '값': stats.scoop_count },
        { '항목': '단독', '값': stats.exclusive_count },
        { '항목': 'S등급', '값': stats.s_grade },
        { '항목': 'A등급', '값': stats.a_grade }
    ];
    const ws2 = XLSX.utils.json_to_sheet(summaryData);
    ws2['!cols'] = [{ wch: 15 }, { wch: 30 }];
    XLSX.utils.book_append_sheet(wb, ws2, '요약');
    
    // 파일명 생성
    const fileName = `${reporterName}_${getPeriodText().replace(/[~\s]/g, '_')}.xlsx`;
    
    // 다운로드
    XLSX.writeFile(wb, fileName);
    showToast('엑셀 파일이 다운로드되었습니다');
}

// 직위 수정
function editPosition() {
    const positions = ['기자', '선임기자', '차장', '부장', '국장', '논설위원', '대기자', '특파원'];
    const currentPos = document.getElementById('positionText').textContent;
    
    const select = document.createElement('select');
    select.className = 'form-select form-select-sm';
    select.style.cssText = 'width:120px; display:inline-block; background:rgba(255,255,255,0.9); color:#333;';
    
    positions.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        if (p === currentPos) opt.selected = true;
        select.appendChild(opt);
    });
    
    const container = document.getElementById('reporterDept');
    container.innerHTML = '';
    container.appendChild(select);
    
    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn btn-sm btn-light ms-2';
    saveBtn.innerHTML = '<i class="bi bi-check"></i>';
    saveBtn.onclick = async function(e) {
        e.stopPropagation();
        const newPos = select.value;
        
        // localStorage에 저장
        const posKey = 'kpi_positions';
        const saved = localStorage.getItem(posKey);
        const positionsData = saved ? JSON.parse(saved) : {};
        positionsData[reporterName] = newPos;
        localStorage.setItem(posKey, JSON.stringify(positionsData));
        
        // 서버에도 저장
        try {
            await fetch(EVAL_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ['position_' + reporterName]: { position: newPos } })
            });
        } catch (e) {
            console.log('직위 서버 저장 실패:', e);
        }
        
        container.innerHTML = `<span id="positionText">${newPos}</span><i class="bi bi-pencil-fill ms-1" style="font-size:0.7rem;"></i>`;
        container.onclick = editPosition;
        showToast('직위가 저장되었습니다');
    };
    container.appendChild(saveBtn);
    
    select.focus();
    container.onclick = null;
}

// 저장된 직위 불러오기
async function loadSavedPosition() {
    // 서버에서 먼저 불러오기
    try {
        const res = await fetch(EVAL_API_URL + '?t=' + Date.now());
        if (res.ok) {
            const serverData = await res.json();
            const posKey = 'position_' + reporterName;
            if (serverData[posKey] && serverData[posKey].position) {
                document.getElementById('positionText').textContent = serverData[posKey].position;
                return;
            }
        }
    } catch (e) {
        console.log('직위 서버 로드 실패:', e);
    }
    
    // 서버 실패시 localStorage
    const posKey = 'kpi_positions';
    const saved = localStorage.getItem(posKey);
    if (saved) {
        const positions = JSON.parse(saved);
        if (positions[reporterName]) {
            document.getElementById('positionText').textContent = positions[reporterName];
        }
    }
}

// ========== "내 점수" 페이지 렌더링 (기자 전용) ==========
function renderMyScorePage() {
    if (!reporterData || !reporterData.articles) {
        document.getElementById('mainContent').innerHTML = '<div class="p-4 text-center text-muted">데이터가 없습니다</div>';
        return;
    }
    
    // Feature Flags 가져오기
    const flags = ScoreDataStore ? ScoreDataStore.getFeatureFlags() : {
        SHOW_MY_SCORE: true,
        SHOW_PREVIOUS_MONTH: true,
        SHOW_DEPT_AVERAGE: false,
        SHOW_DEPT_RANKING: false
    };
    
    // 날짜 네비게이션 숨기기
    document.getElementById('dateNav').style.display = 'none';
    
    // 전체 기사 대상
    const articles = reporterData.articles;
    
    let totalScore = 0;
    const articleCards = articles.map(article => {
        const evalData = ScoreDataStore ? ScoreDataStore.getEval(article.nsid) : null;
        // is_auto_top 면톱 결정: eval에 명시적 값이 있으면 그걸 사용, 없으면 is_auto_top 따름
        const resolvedTopArticle = evalData?.isTopArticle !== undefined 
            ? evalData.isTopArticle 
            : (article.is_auto_top || false);
        const scoreInput = {
            page: article.paper_number || 10,
            charCount: article.char_count || 0,
            isTopArticle: resolvedTopArticle
        };
        getQualityBonusItems().forEach(item => {
            if (item.id === 'isTopArticle') return;
            scoreInput[item.id] = evalData?.[item.id] || false;
        });
        const scoreResult = calculateArticleScore(scoreInput);
        totalScore += scoreResult.totalScore;
        
        // 배지 생성 (동적)
        let badges = '';
        if (scoreInput.isTopArticle) badges += `<span class="badge bg-warning text-dark me-1">${article.is_auto_top ? '🏅면톱(자동)' : '🏅면톱'}</span>`;
        if (!scoreInput.isTopArticle && article.is_auto_top) badges += '<span class="badge bg-secondary me-1" style="text-decoration:line-through;">톱(자동해제)</span>';
        getQualityBonusItems().forEach(item => {
            if (item.id === 'isTopArticle') return;
            if (scoreInput[item.id]) badges += `<span class="badge bg-primary me-1">${item.icon}${item.label}</span>`;
        });
        
        // 검토요청 상태 확인
        const appeals = ScoreDataStore ? ScoreDataStore.getAppeals({ reporterId: session.userId }) : [];
        const existingAppeal = appeals.find(a => a.nsid === article.nsid);
        let actionHtml = '';
        if (existingAppeal) {
            const statusBadge = existingAppeal.status === 'SUBMITTED' ? '<span class="badge bg-secondary">검토중</span>' :
                               existingAppeal.status === 'APPROVED' ? '<span class="badge bg-success">승인됨</span>' :
                               '<span class="badge bg-danger">반려됨</span>';
            actionHtml = statusBadge;
        } else {
            actionHtml = `<button class="btn btn-sm btn-outline-secondary appeal-btn" data-nsid="${article.nsid}" data-title="${escapeHtml(article.title || '')}">검토요청</button>`;
        }
        
        // Feature Flag: 점수 표시 여부
        const scoreDisplay = flags.SHOW_MY_SCORE ? scoreResult.totalScore + '점' : '-';
        const scoreColor = flags.SHOW_MY_SCORE ? 
            (scoreResult.totalScore >= 15 ? '#dc3545' : (scoreResult.totalScore >= 10 ? '#fd7e14' : '#2c5282')) : '#718096';
        
        return `
            <div class="article-card" style="display:flex; align-items:center; padding:1rem; border-bottom:1px solid #e2e8f0;">
                <div style="flex:1; min-width:0;">
                    <a href="${article.url || '#'}" target="_blank" class="text-decoration-none fw-bold text-dark" style="display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(article.title || '제목없음')}</a>
                    <small class="text-muted">${article.pub_date || ''}</small>
                </div>
                <div style="width:50px; text-align:center; font-weight:600; color:#4a5568;">${article.paper_number || '-'}면</div>
                <div style="width:70px; text-align:center; font-weight:700; color:${scoreColor};">${scoreDisplay}</div>
                <div style="width:150px; text-align:center;">${badges || '<span class="text-muted">-</span>'}</div>
                <div style="width:90px; text-align:center;">${actionHtml}</div>
            </div>
        `;
    }).join('');
    
    // Feature Flag: 총점 표시 여부
    const totalScoreDisplay = flags.SHOW_MY_SCORE ? totalScore.toFixed(1) : '-';
    
    // Feature Flag: 부서 평균/순위 계산
    let deptStatsHtml = '';
    if (flags.SHOW_DEPT_AVERAGE || flags.SHOW_DEPT_RANKING) {
        const deptStats = calculateDeptStats();
        if (flags.SHOW_DEPT_AVERAGE && deptStats.deptAvg !== null) {
            deptStatsHtml += `
                <div style="display:inline-block; margin-left:2rem; padding:0.5rem 1rem; background:rgba(255,255,255,0.15); border-radius:8px;">
                    <div style="font-size:0.75rem; opacity:0.8;">부서 평균</div>
                    <div style="font-size:1.2rem; font-weight:700;">${deptStats.deptAvg.toFixed(1)}</div>
                </div>
            `;
        }
        if (flags.SHOW_DEPT_RANKING && deptStats.myRank !== null) {
            deptStatsHtml += `
                <div style="display:inline-block; margin-left:1rem; padding:0.5rem 1rem; background:rgba(255,255,255,0.15); border-radius:8px;">
                    <div style="font-size:0.75rem; opacity:0.8;">부서 내 순위</div>
                    <div style="font-size:1.2rem; font-weight:700;">${deptStats.myRank}위/${deptStats.totalCount}명</div>
                </div>
            `;
        }
    }
    
    document.getElementById('mainContent').innerHTML = `
        <div class="card">
            <div class="card-header" style="background: linear-gradient(135deg, #1a365d 0%, #2c5282 100%); color: white;">
                <div class="d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-star-fill me-2"></i>나의 기사 점수</span>
                    <span class="badge bg-light text-dark">${articles.length}건</span>
                </div>
            </div>
            <div class="card-body p-0">
                <!-- 총점 헤더 -->
                <div style="background:#ebf4ff; padding:1.5rem; border-bottom:2px solid #2c5282;">

// 부서 통계 계산 (부서 평균, 순위)
// usersData는 loadData()에서 로드됨
let usersDataCache = null;

async function loadUsersData() {
    if (usersDataCache) return usersDataCache;
    try {
        const res = await fetch('users.json?t=' + Date.now());
        usersDataCache = await res.json();
        return usersDataCache;
    } catch (e) {
        console.error('users.json 로드 실패:', e);
        return [];
    }
}

function calculateDeptStats() {
    if (!allData || !allData.reporters) return { deptAvg: null, myRank: null, totalCount: 0 };
    
    // 현재 기자의 부서 찾기 (session에서)
    const myDept = session.department;
    if (!myDept) return { deptAvg: null, myRank: null, totalCount: 0 };
    
    // usersDataCache가 없으면 비동기로 로드 후 다시 렌더링
    if (!usersDataCache) {
        loadUsersData().then(() => {
            if (currentPeriod === 'myscore') renderMyScorePage();
        });
        return { deptAvg: null, myRank: null, totalCount: 0 };
    }
    
    const evals = ScoreDataStore ? ScoreDataStore.getEvals() : {};
    const scores = [];
    
    // 같은 부서 기자들만 필터링
    const deptReporters = usersDataCache.filter(u => u.department === myDept && u.role === 'reporter');
    const deptReporterNames = new Set(deptReporters.map(u => u.name));
    
    // 같은 부서 기자들의 점수 계산
    allData.reporters.forEach(reporter => {
        // 같은 부서 기자만 계산
        if (!deptReporterNames.has(reporter.name)) return;
        if (!reporter.articles) return;
        
        let reporterScore = 0;
        reporter.articles.forEach(article => {
            const evalData = evals[article.nsid] || {};
            const resolvedTopArticle = evalData.isTopArticle !== undefined 
                ? evalData.isTopArticle 
                : (article.is_auto_top || false);
            const scoreInput = {
                page: article.paper_number || 10,
                charCount: article.char_count || 0,
                isTopArticle: resolvedTopArticle
            };
            getQualityBonusItems().forEach(item => {
                if (item.id === 'isTopArticle') return;
                scoreInput[item.id] = evalData[item.id] || false;
            });
            reporterScore += calculateArticleScore(scoreInput).totalScore;
        });
        scores.push({ name: reporter.name, score: reporterScore });
    });
    
    if (scores.length === 0) return { deptAvg: null, myRank: null, totalCount: 0 };
    
    // 부서 평균
    const totalDeptScore = scores.reduce((sum, s) => sum + s.score, 0);
    const deptAvg = totalDeptScore / scores.length;
    
    // 내 순위
    scores.sort((a, b) => b.score - a.score);
    const myRank = scores.findIndex(s => s.name === reporterName) + 1;
    
    return {
        deptAvg: deptAvg,
        myRank: myRank > 0 ? myRank : null,
        totalCount: scores.length
    };
}

// 검토요청 제출 (기자용)
async function submitAppeal() {
    const nsid = document.getElementById('appealNsid').value;
    const qualityType = document.getElementById('appealType').value;
    const reason = document.getElementById('appealReason').value.trim();
    const title = document.getElementById('appealArticleTitle').textContent;
    
    if (!qualityType) {
        alert('요청 유형을 선택해주세요.');
        return;
    }
    if (!reason) {
        alert('요청 사유를 입력해주세요.');
        return;
    }
    
    // 기사 정보 찾기
    const article = reporterData.articles.find(a => a.nsid === nsid);
    
    // ScoreDataStore에 저장
    if (typeof ScoreDataStore !== 'undefined') {
        ScoreDataStore.createAppeal({
            nsid: nsid,
            articleTitle: title,
            reporterId: session.userId,
            reporterName: session.name,
            department: session.department || '',
            qualityType: qualityType,
            reason: reason,
            pubDate: article ? article.pub_date : '',
            page: article ? article.paper_number : 0
        });
        
        // Lambda API에도 저장
        try {
            const appeals = ScoreDataStore.getAppeals();
            await fetch(EVAL_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ _appeals: appeals })
            });
        } catch (e) {
            console.log('서버 저장 실패:', e);
        }
    }
    
    // 모달 닫기
    bootstrap.Modal.getInstance(document.getElementById('appealModal')).hide();
    showToast('검토 요청이 제출되었습니다');
    
    // 테이블 다시 렌더링
    renderContent();
}

}
